<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Render Markup Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <!-- Supabase (Storage only — used purely as a blob store for shared boards, no auth/DB). -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        }

        .grid-background {
            background-color: #111111;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: -1px -1px;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 64px); /* Subtract toolbar height */
            z-index: 10;
        }

        /* One unified toolbar, hand-rolled plain CSS (not @apply) — the Tailwind CDN's
           runtime compiler only scans class="" attributes and <style type="text/tailwindcss">
           blocks, so @apply inside an ordinary <style> tag silently does nothing in a real
           browser. Every control below shares this same look, matching the old "right cluster"
           (dark pill, thin border, uppercase gray labels) as the baseline style. */
        .toolbar-shell {
            display: flex;
            align-items: center;
            gap: 2px;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 10px;
            padding: 6px 8px;
            max-width: 100%;
            overflow-x: auto;
        }

        .toolbar-divider {
            width: 1px;
            height: 26px;
            background: #374151;
            margin: 0 6px;
            flex-shrink: 0;
        }

        .toolbar-label {
            font-size: 11px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
            white-space: nowrap;
        }

        .toolbar-value {
            font-size: 11px;
            color: #d1d5db;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            width: 30px;
            text-align: right;
            flex-shrink: 0;
        }

        /* Manual number entry next to a slider — same look as .toolbar-value but editable.
           Same font as the toolbar labels (not monospace), sized to fit a decimal like "2.5". */
        .toolbar-number {
            font-size: 11px;
            color: #d1d5db;
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
            /* box-sizing: content-box so `width` is just the digits, unaffected by the
               padding/border that border-box (Tailwind's global default) would eat into it */
            box-sizing: content-box;
            width: 3ch;
            text-align: right;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid #374151;
            border-radius: 5px;
            padding: 3px 5px;
            /* Hide the native spinner arrows — plenty of room to type, no need for +/- clutter */
            -moz-appearance: textfield;
        }
        .toolbar-number:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .toolbar-number::-webkit-inner-spin-button,
        .toolbar-number::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Smaller thumb (the "dot") on the toolbar sliders — the default browser size feels
           oversized next to these compact controls. accent-color still drives the track fill. */
        .toolbar-slider {
            height: 4px;
        }
        .toolbar-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
        }
        .toolbar-slider::-moz-range-thumb {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #3b82f6;
            border: none;
            cursor: pointer;
        }

        .toolbar-btn, .toolbar-icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #9ca3af;
            background: transparent;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 120ms ease-out, color 120ms ease-out, transform 120ms ease-out;
        }

        .toolbar-btn {
            padding: 7px 10px;
            font-size: 12px;
            font-weight: 500;
        }
        .toolbar-btn i { font-size: 13px; }
        .toolbar-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.07); }
        .toolbar-btn:active { transform: scale(0.93); }
        .toolbar-btn.active {
            color: #60a5fa;
            background: rgba(59, 130, 246, 0.14);
            box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.35);
        }

        .toolbar-icon-btn {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
        }
        .toolbar-icon-btn i { font-size: 15px; }
        .toolbar-icon-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.07); }
        .toolbar-icon-btn:active { transform: scale(0.9); }
        .toolbar-icon-btn:disabled { opacity: 0.3; pointer-events: none; }
        .toolbar-icon-btn.danger:hover { color: #f87171; background: rgba(248, 113, 113, 0.12); }

        .toolbar-btn-primary {
            color: #fff;
            background: #2563eb;
            font-weight: 600;
        }
        .toolbar-btn-primary:hover { background: #3b82f6; color: #fff; }

        /* Thin, unobtrusive scrollbar for the overflowing tool row */
        .tool-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .tool-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 9999px;
        }
        .tool-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        #multi-select-toolbar {
            opacity: 0;
            transform: translateX(-50%) translateY(4px) scale(0.96);
            transition: opacity 150ms ease-out, transform 150ms ease-out;
            pointer-events: none;
        }
        #multi-select-toolbar.toolbar-visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
            pointer-events: auto;
        }

        .image-name-label {
            opacity: 0;
            /* transform is set inline by JS (translate + a canvas-zoom scale factor, so the
               label's on-screen size tracks the image's own on-screen size) — only the fade
               is handled here. */
            transition: opacity 150ms ease-out;
        }
        .image-name-label.label-visible {
            opacity: 1;
        }

        /* Hide default file input */
        input[type="file"] {
            display: none;
        }

        /* Custom tooltip — replaces native title="" tooltips (slow, OS-styled, inconsistent) */
        #app-tooltip {
            position: fixed;
            z-index: 200;
            background: #030712;
            color: #e5e7eb;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.01em;
            line-height: 1.3;
            padding: 5px 9px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
            pointer-events: none;
            opacity: 0;
            transform: translateY(-3px);
            transition: opacity 100ms ease-out, transform 100ms ease-out;
            max-width: 220px;
            white-space: nowrap;
        }
        #app-tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* App-level views: home (projects) / project (shots) / editor (the canvas tool).
           Exactly one is display:flex at a time, switched by showView() — see the JS below. */
        #view-home, #view-project, #view-editor {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }
        #view-home, #view-project {
            position: fixed;
            inset: 0;
            z-index: 15;
            background: #000;
        }

        .project-card, .board-card {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: border-color 120ms ease-out, transform 120ms ease-out;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .project-card:hover, .board-card:hover {
            border-color: #3b82f6;
            transform: translateY(-2px);
        }
        /* Home page's project list: a centered, scrollable column of full-width rows
           instead of the boards grid's square cards. */
        .project-card.project-row {
            flex-direction: row;
            align-items: center;
            width: 100%;
        }

        .modal-input {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid #374151;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 13px;
            color: #e5e7eb;
            outline: none;
            font-family: inherit;
        }
        .modal-input:focus { border-color: #3b82f6; }
        .modal-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #9ca3af;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 11px;
            color: #d1d5db;
            cursor: pointer;
            white-space: nowrap;
        }
        .history-item:hover { background: rgba(255, 255, 255, 0.07); }
        .history-item.current { color: #60a5fa; }
    </style>
</head>
<body class="font-sans text-gray-200 flex flex-col antialiased">

    <!-- Home: pick a project, or create a new one -->
    <div id="view-home">
        <div class="grid-background" style="position:fixed;"></div>
        <header class="h-16 bg-gray-950/95 backdrop-blur-sm border-b border-gray-800 flex items-center justify-between px-6 z-20 shadow-xl shrink-0">
            <h1 class="text-sm font-semibold text-gray-100 tracking-wide">Projects</h1>
            <button id="btn-new-project" class="toolbar-btn toolbar-btn-primary">
                <i class="fa-solid fa-plus"></i><span>New Project</span>
            </button>
        </header>
        <div class="relative z-10 flex-1 overflow-y-auto p-8">
            <div id="project-grid" class="flex flex-col gap-3 max-w-md mx-auto"></div>
            <div id="project-empty" class="hidden text-gray-500 text-sm mt-10 text-center">No projects yet — click "New Project" to get started.</div>
        </div>
    </div>

    <!-- Project: pick a shot (board), or add more to the shot list -->
    <div id="view-project">
        <div class="grid-background" style="position:fixed;"></div>
        <header class="h-16 bg-gray-950/95 backdrop-blur-sm border-b border-gray-800 flex items-center justify-between px-6 z-20 shadow-xl shrink-0">
            <div class="flex items-center gap-3 min-w-0">
                <button id="btn-project-back" class="toolbar-icon-btn" data-tooltip="Back to projects"><i class="fa-solid fa-arrow-left"></i></button>
                <h1 id="project-title" class="text-sm font-semibold text-gray-100 truncate">Project</h1>
            </div>
            <button id="btn-new-board" class="toolbar-btn toolbar-btn-primary">
                <i class="fa-solid fa-plus"></i><span>Add Shots</span>
            </button>
        </header>
        <div class="relative z-10 flex-1 overflow-y-auto p-8">
            <div id="board-grid" class="grid gap-4" style="grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));"></div>
            <div id="board-empty" class="hidden text-gray-500 text-sm mt-10 text-center">No shots yet — click "Add Shots" to get started.</div>
        </div>
    </div>

    <!-- Generic in-app dialog, used instead of native prompt()/confirm() popups -->
    <div id="app-modal" class="hidden fixed inset-0 z-[110] items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="bg-gray-950 border border-gray-700 rounded-lg shadow-2xl w-[90vw] max-w-md flex flex-col">
            <div class="flex items-center justify-between px-5 py-3.5 border-b border-gray-800">
                <h2 id="app-modal-title" class="text-sm font-semibold text-gray-100">Title</h2>
                <button id="app-modal-close" class="text-gray-500 hover:text-white transition-colors"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div id="app-modal-body" class="p-5 flex flex-col gap-4"></div>
            <div class="flex items-center justify-end gap-2 px-5 py-3.5 border-t border-gray-800">
                <button id="app-modal-cancel" class="h-8 px-3 rounded text-xs font-medium text-gray-300 hover:bg-gray-800 transition-colors">Cancel</button>
                <button id="app-modal-confirm" class="h-8 px-3.5 rounded bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white transition-colors">Create</button>
            </div>
        </div>
    </div>

    <div id="view-editor">
    <header class="h-16 bg-gray-950/95 backdrop-blur-sm border-b border-gray-800 flex items-center px-4 gap-3 z-20 shadow-xl shrink-0">
        <div class="flex items-center gap-2 shrink-0">
            <button id="btn-editor-back" class="toolbar-icon-btn" data-tooltip="Back to board">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <span id="editor-breadcrumb" class="text-xs text-gray-400 whitespace-nowrap hidden lg:inline"></span>
        </div>
        <div class="flex-1 flex justify-center overflow-hidden">
        <div class="toolbar-shell tool-scroll" id="main-toolbar">
            <label class="toolbar-btn toolbar-btn-primary" data-tooltip="Upload one or more images from your device">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>Upload</span>
                <!-- Allow multiple image selection -->
                <input type="file" id="imageUpload" accept="image/*,application/pdf" multiple>
            </label>
            <button id="btn-undo" class="toolbar-icon-btn" data-tooltip="Undo (Ctrl+Z)" disabled>
                <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button id="btn-share" class="toolbar-btn" data-tooltip="Save this version">
                <i class="fa-solid fa-floppy-disk"></i>
                <span>Save</span>
            </button>
            <button id="btn-history" class="toolbar-icon-btn" data-tooltip="Version history">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </button>

            <div class="toolbar-divider"></div>

            <button class="toolbar-btn active" id="btn-select" data-tooltip="Select & Move">
                <i class="fa-solid fa-arrow-pointer"></i>
                <span>Select</span>
            </button>
            <button class="toolbar-btn" id="btn-draw" data-tooltip="Freehand Draw">
                <i class="fa-solid fa-pen"></i>
                <span>Draw</span>
            </button>
            <button class="toolbar-btn" id="btn-arrow" data-tooltip="Draw Arrow">
                <i class="fa-solid fa-arrow-right"></i>
                <span>Arrow</span>
            </button>

            <div class="toolbar-divider"></div>

            <button class="toolbar-btn" id="btn-text" data-tooltip="Add Text">
                <i class="fa-solid fa-t"></i>
                <span>Text</span>
            </button>
            <button class="toolbar-btn" id="btn-callout" data-tooltip="Add Text Callout">
                <i class="fa-solid fa-comment-dots"></i>
                <span>Callout</span>
            </button>

            <div class="toolbar-divider"></div>

            <button class="toolbar-btn" id="btn-rect" data-tooltip="Add Square">
                <i class="fa-regular fa-square"></i>
                <span>Square</span>
            </button>
            <button class="toolbar-btn" id="btn-circle" data-tooltip="Add Circle">
                <i class="fa-regular fa-circle"></i>
                <span>Circle</span>
            </button>
            <button class="toolbar-btn" id="btn-poly" data-tooltip="Add Polygon">
                <i class="fa-solid fa-draw-polygon"></i>
                <span>Polygon</span>
            </button>

            <div class="toolbar-divider"></div>

            <div class="flex items-center gap-1.5 px-1" data-tooltip="Annotation Color">
                <span class="toolbar-label">Color</span>
                <input type="color" id="colorPicker" value="#ef4444" class="w-6 h-6 rounded cursor-pointer bg-transparent border-0 p-0">
            </div>

            <div class="toolbar-divider"></div>

            <div class="flex items-center gap-1.5 px-1" data-tooltip="Line Thickness">
                <span class="toolbar-label">Weight</span>
                <input type="range" id="lineWidth" min="1" max="20" value="4" class="toolbar-slider w-24 accent-blue-500 cursor-pointer">
                <input type="number" id="lineWidthNumber" min="1" max="20" value="4" class="toolbar-number">
            </div>

            <div class="toolbar-divider"></div>

            <div class="flex items-center gap-1.5 px-1" data-tooltip="Font style and size">
                <span class="toolbar-label">Font</span>
                <select id="fontFamily" class="bg-gray-800 text-xs text-gray-200 border-none rounded p-1 cursor-pointer outline-none">
                    <option value="sans-serif">Sans</option>
                    <option value="serif">Serif</option>
                    <option value="monospace">Mono</option>
                </select>
                <input type="range" id="fontSize" min="10" max="72" value="20" class="toolbar-slider w-24 accent-blue-500 cursor-pointer">
                <input type="number" id="fontSizeNumber" min="10" max="72" value="20" class="toolbar-number">
            </div>

            <div class="toolbar-divider"></div>

            <div class="flex items-center gap-1.5 px-1" data-tooltip="Callout/text background opacity">
                <span class="toolbar-label">Opacity</span>
                <input type="range" id="opacitySlider" min="0" max="1" step="0.1" value="0.5" class="toolbar-slider w-20 accent-blue-500 cursor-pointer">
                <input type="number" id="opacityNumber" min="0" max="1" step="0.05" value="0.5" class="toolbar-number">
            </div>

            <div class="toolbar-divider"></div>

            <button id="btn-fullscreen" class="toolbar-icon-btn" data-tooltip="Toggle Fullscreen">
                <i class="fa-solid fa-expand" id="fullscreen-icon"></i>
            </button>
            <button id="btn-delete" class="toolbar-icon-btn danger" data-tooltip="Delete Selected Object (or press Del)" disabled>
                <i class="fa-solid fa-trash-can"></i>
            </button>
        </div>
        </div>
    </header>

    <main class="relative flex-1">
        <div class="grid-background"></div>
        
        <div id="drop-overlay" class="absolute inset-0 z-50 hidden flex-col items-center justify-center bg-blue-900/80 backdrop-blur-sm border-4 border-blue-500 border-dashed m-4 rounded-xl pointer-events-none transition-all">
            <i class="fa-solid fa-cloud-arrow-down text-6xl text-white mb-4 animate-bounce"></i>
            <h2 class="text-3xl font-bold text-white">Drop Images Here</h2>
            <p class="text-blue-200 mt-2">Release to add to canvas</p>
        </div>

        <div id="canvas-container">
            <canvas id="c"></canvas>
        </div>

        <div id="multi-select-toolbar" class="absolute z-50 flex bg-gray-950/95 backdrop-blur-sm border border-gray-700 rounded-lg shadow-xl p-1.5 gap-1">
            <div id="multi-only-controls" class="contents">
            <button id="btn-layout-row" class="flex items-center justify-center w-8 h-8 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition-colors" data-tooltip="Organize as Row">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1" y="4" width="6" height="8" rx="1.4" fill="currentColor"/>
                    <rect x="9" y="4" width="6" height="8" rx="1.4" fill="currentColor"/>
                </svg>
            </button>
            <button id="btn-layout-col" class="flex items-center justify-center w-8 h-8 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition-colors" data-tooltip="Organize as Column">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="4" y="1" width="8" height="6" rx="1.4" fill="currentColor"/>
                    <rect x="4" y="9" width="8" height="6" rx="1.4" fill="currentColor"/>
                </svg>
            </button>
            <button id="btn-layout-grid" class="flex items-center justify-center w-8 h-8 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition-colors" data-tooltip="Organize as Grid">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1" y="1" width="6" height="6" rx="1.2" fill="currentColor"/>
                    <rect x="9" y="1" width="6" height="6" rx="1.2" fill="currentColor"/>
                    <rect x="1" y="9" width="6" height="6" rx="1.2" fill="currentColor"/>
                    <rect x="9" y="9" width="6" height="6" rx="1.2" fill="currentColor"/>
                </svg>
            </button>

            <div class="w-px h-6 bg-gray-700 mx-1 self-center"></div>
            
            <button id="btn-align-top" class="flex items-center justify-center w-8 h-8 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition-colors" data-tooltip="Align Top">
                <i class="fa-solid fa-align-left text-sm" style="transform: rotate(90deg);"></i>
            </button>
            <button id="btn-align-center" class="flex items-center justify-center w-8 h-8 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition-colors" data-tooltip="Align Center">
                <i class="fa-solid fa-align-center text-sm"></i>
            </button>
            <button id="btn-align-bottom" class="flex items-center justify-center w-8 h-8 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition-colors" data-tooltip="Align Bottom">
                <i class="fa-solid fa-align-right text-sm" style="transform: rotate(90deg);"></i>
            </button>

            <div class="w-px h-6 bg-gray-700 mx-1 self-center"></div>

            <button id="btn-scale-width" class="flex items-center justify-center w-8 h-8 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition-colors" data-tooltip="Match Max Width">
                <i class="fa-solid fa-arrows-left-right text-sm"></i>
            </button>
            <button id="btn-scale-height" class="flex items-center justify-center w-8 h-8 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition-colors" data-tooltip="Match Max Height">
                <i class="fa-solid fa-arrows-up-down text-sm"></i>
            </button>
            </div>

            <button id="btn-compare" class="hidden flex items-center justify-center gap-1.5 h-8 px-2.5 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition-colors">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1" y="1" width="14" height="14" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.2"/>
                    <circle cx="8" cy="8" r="2.4" fill="currentColor"/>
                </svg>
                <span class="text-xs font-medium" id="btn-compare-label">Compare</span>
            </button>

            <div class="relative">
                <button id="btn-reorder" class="flex items-center justify-center gap-1.5 h-8 px-2.5 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-layer-group text-sm"></i>
                    <span class="text-xs font-medium">Reorder</span>
                </button>
                <div id="reorder-popup" class="hidden absolute top-full right-0 mt-1.5 flex bg-gray-950/95 backdrop-blur-sm border border-gray-700 rounded-lg shadow-xl p-1.5 gap-1 z-50">
                    <button id="btn-reorder-front" class="flex items-center justify-center w-8 h-8 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition-colors" data-tooltip="Bring to Front">
                        <i class="fa-solid fa-angles-up text-sm"></i>

                    <button id="btn-reorder-forward" class="flex items-center justify-center w-8 h-8 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition-colors" data-tooltip="Bring Forward">
                        <i class="fa-solid fa-angle-up text-sm"></i>
                    </button>
                    <button id="btn-reorder-backward" class="flex items-center justify-center w-8 h-8 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition-colors" data-tooltip="Send Backward">
                        <i class="fa-solid fa-angle-down text-sm"></i>

                    <button id="btn-reorder-back" class="flex items-center justify-center w-8 h-8 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition-colors" data-tooltip="Send to Back">

        <div id="image-name-label" class="image-name-label absolute z-50 bg-gray-950/95 backdrop-blur-sm border border-gray-700 rounded-md shadow-xl px-2.5 py-1 text-xs text-gray-200 font-medium pointer-events-none whitespace-nowrap"></div>

        <div id="compare-pick-hint" class="hidden absolute z-50 top-4 left-1/2 -translate-x-1/2 bg-gray-950/95 backdrop-blur-sm border border-blue-500 rounded-lg shadow-xl px-4 py-2 text-sm text-gray-100 font-medium pointer-events-none whitespace-nowrap">
            Click another image to compare it with &mdash; <span class="text-gray-400">Esc to cancel</span>
        </div>

        <div id="share-toast" class="hidden absolute z-50 top-4 left-1/2 -translate-x-1/2 max-w-md text-center bg-gray-950/95 backdrop-blur-sm border border-gray-700 rounded-lg shadow-xl px-4 py-2 text-sm text-gray-100 font-medium pointer-events-none"></div>

        <!-- For text/callout selections, colorPicker's own click is intercepted (see

             with fixed + JS-computed top/left (see openTextColorPopover) instead of being

        <!-- Positioned fixed + JS-computed top/left (like textColorPopover below) rather than
             nested in the toolbar, whose horizontal-scroll strip clips anything hanging below it. -->

                <span class="toolbar-label w-16">Background</span>
                <input type="color" id="textBgColorInput" value="#ffffff" class="w-6 h-6 rounded cursor-pointer bg-transparent border-0 p-0">

        <div id="pdf-page-modal" class="hidden fixed inset-0 z-[100] items-center justify-center bg-black/60 backdrop-blur-sm">
            <div class="bg-gray-950 border border-gray-700 rounded-lg shadow-2xl w-[90vw] max-w-3xl max-h-[85vh] flex flex-col">
                <div class="flex items-center justify-between px-5 py-3.5 border-b border-gray-800">
                    <h2 class="text-sm font-semibold text-gray-100">Select pages to import <span id="pdf-modal-filename" class="text-gray-500 font-normal"></span></h2>
                    <button id="pdf-modal-close" class="text-gray-500 hover:text-white transition-colors">

                <div class="flex items-center justify-between px-5 py-3.5 border-t border-gray-800">

                        <button id="pdf-select-all" class="text-xs font-medium text-gray-400 hover:text-white transition-colors">Select all</button>
                        <button id="pdf-select-none" class="text-xs font-medium text-gray-400 hover:text-white transition-colors">Select none</button>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="pdf-modal-cancel" class="h-8 px-3 rounded text-xs font-medium text-gray-300 hover:bg-gray-800 transition-colors">Cancel</button>
                        <button id="pdf-modal-add" class="h-8 px-3.5 rounded bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white transition-colors disabled:opacity-40 disabled:pointer-events-none">Add <span id="pdf-select-count">0</span> pages</button>
                    </div>

    </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Custom hover tooltips for every [data-tooltip] element — small delay before
            // showing, clean styling, positioned under the element (these all live in the
            // header, so above would run off-screen).
            (function setupTooltips() {
                const tooltipEl = document.createElement('div');
                tooltipEl.id = 'app-tooltip';
                document.body.appendChild(tooltipEl);
                let showTimer = null;

                function showTooltip(el) {
                    const text = el.getAttribute('data-tooltip');
                    if (!text) return;
                    tooltipEl.textContent = text;
                    const rect = el.getBoundingClientRect();
                    const tRect = tooltipEl.getBoundingClientRect();
                    let left = rect.left + rect.width / 2 - tRect.width / 2;
                    left = Math.max(6, Math.min(left, window.innerWidth - tRect.width - 6));
                    tooltipEl.style.left = `${left}px`;
                    tooltipEl.style.top = `${rect.bottom + 8}px`;
                    tooltipEl.classList.add('visible');
                }

                function hideTooltip() {
                    clearTimeout(showTimer);
                    tooltipEl.classList.remove('visible');
                }

                document.querySelectorAll('[data-tooltip]').forEach(el => {
                    // Restore an accessible name for icon-only buttons now that title="" is gone
                    if (!el.hasAttribute('aria-label')) el.setAttribute('aria-label', el.getAttribute('data-tooltip'));
                    el.addEventListener('mouseenter', () => {
                        clearTimeout(showTimer);
                        showTimer = setTimeout(() => showTooltip(el), 350);
                    });
                    el.addEventListener('mouseleave', hideTooltip);
                    el.addEventListener('mousedown', hideTooltip);
                });
            })();

            // Setup Canvas
            const canvasContainer = document.getElementById('canvas-container');
            const canvas = new fabric.Canvas('c', {
                // #view-editor starts hidden (the app boots into the home/projects view), so
                // canvasContainer has zero size at this point — fall back to the window size;
                // showView('editor') resizes it properly once the container is actually visible.
                width: canvasContainer.clientWidth || window.innerWidth,
                height: canvasContainer.clientHeight || (window.innerHeight - 64),
                preserveObjectStacking: true, // Ensure objects stay in selected z-index order
                fireMiddleClick: true, // Enable middle mouse interaction for panning
                targetFindTolerance: 4, // A little forgiveness for perPixelTargetFind hit tests (callout legs)
                // Fabric's own default is the four-way "move" cursor over any draggable object —
                // keep the plain arrow instead, everywhere except the few spots (like the callout
                // arrowhead) that explicitly opt into 'move' via their own hoverCursor.
                hoverCursor: 'default',
                moveCursor: 'default'
            });

            // Smaller, cleaner selection handles flush with object edges (no padding gap)
            fabric.Object.prototype.set({
                cornerColor: '#3b82f6',
                cornerStrokeColor: '#1d4ed8',
                borderColor: '#3b82f6',
                cornerSize: 8,
                cornerStyle: 'circle',
                transparentCorners: false,
                borderScaleFactor: 1.5,
                padding: 0
            });

            // State management
            let currentMode = 'select'; // 'select', 'draw', 'arrow'
            let currentColor = document.getElementById('colorPicker').value;
            let currentWidth = parseInt(document.getElementById('lineWidth').value, 10);
            let currentFont = 'sans-serif';
            let currentFontSize = 20;
            let currentOpacity = 0.5;
            let currentTextBgColor = ''; // '' = no background fill on a newly-placed text box
            
            // History State (Undo)
            let history = [];
            let currentState = null;
            let isUndoing = false;

            function saveHistory() {
                if (isUndoing) return;
                if (currentState) {
                    history.push(currentState);
                    if (history.length > 30) history.shift(); // Keep last 30 actions
                }
                // Include callout tags so undo can relink parts and keep the tip anchor correct
                currentState = JSON.stringify(canvas.toJSON(['calloutId', 'calloutRole', 'tipX', 'tipY']));
                updateActionButtons();
            }

            // Keep undo/delete/clear enabled state in sync with canvas contents
            function updateActionButtons() {
                document.getElementById('btn-undo').disabled = history.length === 0;
                document.getElementById('btn-delete').disabled = canvas.getActiveObjects().length === 0;
            }

            // --- Supabase Storage (plain JSON/PNG blob store, no auth) -----------------------
            // DEMO-GRADE, not production: Storage rules need to allow public read+write with no
            // auth, so anyone who discovers the project's storage bucket could write junk to it.
            // Fine for testing with a couple of colleagues; revisit before wider use.
            //
            // Project URL + anon key from Supabase Console -> Project Settings -> API. The anon
            // key is safe to ship client-side (that's its purpose) as long as the bucket's access
            // policy stays limited to what it needs.
            const supabaseUrl = "https://nqfqensursvohcgmmrfw.supabase.co";
            const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xZnFlbnN1cnN2b2hjZ21tcmZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMjE5NDksImV4cCI6MjEwNTU5Nzk0OX0.nKi69GWGgcybCEZ1tSArMcKJE7AQFmmgIGqIKfFt4rY";
            const SUPABASE_BUCKET = "boards";
            const supabaseEnabled = !!(supabaseUrl && supabaseAnonKey && window.supabase);
            const supabaseClient = supabaseEnabled ? window.supabase.createClient(supabaseUrl, supabaseAnonKey) : null;

            const shareToast = document.getElementById('share-toast');
            let shareToastTimer = null;
            function showShareToast(text, isError, holdMs) {
                shareToast.textContent = text;
                shareToast.classList.remove('hidden', 'border-blue-500', 'border-red-500', 'border-gray-700');
                shareToast.classList.add(isError ? 'border-red-500' : 'border-blue-500');
                clearTimeout(shareToastTimer);
                shareToastTimer = setTimeout(() => shareToast.classList.add('hidden'), holdMs || 3500);
            }

            // Storage-quota errors don't have one consistent shape across providers (Firebase
            // Storage uses a 'storage/quota-exceeded' code; Supabase/S3-style backends return an
            // HTTP 413 or a message mentioning the limit) — so this checks loosely across
            // whatever fields are present rather than pinning to one provider's exact error shape.
            function isStorageFullError(err) {
                const haystack = `${err && err.code || ''} ${err && err.message || ''} ${err && err.status || ''}`.toLowerCase();
                return haystack.includes('quota') || haystack.includes('limit') || haystack.includes('413')
                    || (haystack.includes('storage') && (haystack.includes('exceed') || haystack.includes('full')));
            }

            function newId() {
                return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
            }

            async function storageGetJSON(key) {
                const { data } = supabaseClient.storage.from(SUPABASE_BUCKET).getPublicUrl(key);
                // no-store + a cache-busting query param: browsers can be stubborn about reusing
                // a cached response for this exact URL after the file's been re-uploaded (upsert).
                const res = await fetch(`${data.publicUrl}?t=${Date.now()}`, { cache: 'no-store' });
                if (!res.ok) return null;
                return res.json();
            }

            async function storagePutJSON(key, obj) {
                const json = JSON.stringify(obj);
                const { error } = await supabaseClient.storage.from(SUPABASE_BUCKET)
                    .upload(key, json, { contentType: 'application/json', upsert: true, cacheControl: '0' });
                if (error) throw error;
            }

            // --- Projects / Boards data model -------------------------------------------------
            // _index.json            -> { projects: [{id, name, createdAt}] }
            // _project-<id>.json     -> { id, name, createdAt, boards: [{id, code, label, createdAt}] }
            // _board-<id>.json       -> { id, projectId, code, label, createdAt, versions: [{id, savedAt}] }
            // _version-<id>.json     -> { canvasJson, savedAt }   (full board contents — can be large)
            // _thumb-<id>.json       -> { thumb, savedAt }        (small dataURL, kept separate so lists stay cheap)
            //
            // NOTE: the Whitecard/WIP/ICD/R01/R02/Final stage pipeline has been pulled out for
            // now — each shot (board) is a single canvas until the home/project navigation and
            // shot-list workflow below are settled. Re-add a per-stage layer on top of this once
            // that's solid.

            function formatTimestamp(iso) {
                if (!iso) return '';
                const d = new Date(iso);
                return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' +
                    d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
            }

            // --- Generic in-app modal (replaces native prompt()/confirm() popups) --------------
            const appModal = document.getElementById('app-modal');
            const appModalTitle = document.getElementById('app-modal-title');
            const appModalBody = document.getElementById('app-modal-body');
            const appModalConfirm = document.getElementById('app-modal-confirm');
            const appModalCancel = document.getElementById('app-modal-cancel');
            const appModalClose = document.getElementById('app-modal-close');

            function closeModal() {
                appModal.classList.add('hidden');
                appModal.classList.remove('flex');
                appModalBody.innerHTML = '';
                appModalConfirm.onclick = null;
            }

            // options: { title, confirmText, bodyHtml, focusSelector, onConfirm(bodyEl) }
            // onConfirm may return `false` (or a Promise resolving to `false`) to keep the
            // modal open — e.g. after showing a validation error via showShareToast.
            function openModal(options) {
                appModalTitle.textContent = options.title;
                appModalBody.innerHTML = options.bodyHtml;
                appModalConfirm.textContent = options.confirmText || 'Create';
                appModal.classList.remove('hidden');
                appModal.classList.add('flex');
                if (options.focusSelector) {
                    setTimeout(() => { const el = appModalBody.querySelector(options.focusSelector); if (el) el.focus(); }, 30);
                }
                appModalConfirm.onclick = async () => {
                    const result = await options.onConfirm(appModalBody);
                    if (result !== false) closeModal();
                };
            }

            appModalCancel.addEventListener('click', closeModal);
            appModalClose.addEventListener('click', closeModal);
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !appModal.classList.contains('hidden')) closeModal();
            });

            // Parses a shot-list textarea: one shot name per non-blank line.
            function parseShotList(text) {
                return text.split('\n').map(s => s.trim()).filter(Boolean);
            }

            // App-level navigation between the three views. Exactly one is visible at a time.
            const appViews = {
                home: document.getElementById('view-home'),
                project: document.getElementById('view-project'),
                editor: document.getElementById('view-editor')
            };
            const appState = { projectId: null, projectName: '', boardId: null, boardLabel: '', versionId: null };

            function showView(name) {
                Object.entries(appViews).forEach(([k, el]) => { el.style.display = (k === name) ? 'flex' : 'none'; });
                if (name === 'editor') requestAnimationFrame(resizeCanvas);
            }

            if (!supabaseEnabled) {
                showShareToast('Storage is not configured — add your Supabase project config in index.html', true, 6000);
            }

            // --- Home view: projects -----------------------------------------------------------
            const projectGrid = document.getElementById('project-grid');
            const projectEmpty = document.getElementById('project-empty');

            async function loadIndex() {
                return (await storageGetJSON('_index.json')) || { projects: [] };
            }

            async function renderHome() {
                projectGrid.innerHTML = '';
                const index = await loadIndex();
                projectEmpty.classList.toggle('hidden', index.projects.length > 0);
                index.projects.slice().reverse().forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'project-card project-row';
                    card.innerHTML = `
                        <div class="text-blue-400"><i class="fa-solid fa-folder-open"></i></div>
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-semibold text-gray-100 truncate">${p.name}</div>
                            <div class="text-[11px] text-gray-500">Created ${formatTimestamp(p.createdAt)}</div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-gray-600 text-xs"></i>`;
                    card.addEventListener('click', () => openProject(p.id, p.name));
                    projectGrid.appendChild(card);
                });
            }

            function codeForIndex(i) {
                return 'S' + String((i + 1) * 10).padStart(3, '0');
            }

            async function createProject(name, shotLabels) {
                showShareToast('Creating project…');
                try {
                    const index = await loadIndex();
                    const id = newId();
                    const createdAt = new Date().toISOString();
                    index.projects.push({ id, name, createdAt });
                    await storagePutJSON('_index.json', index);

                    const boards = shotLabels.map((label, i) => ({ id: newId(), code: codeForIndex(i), label, createdAt }));
                    await storagePutJSON(`_project-${id}.json`, { id, name, createdAt, boards });
                    await Promise.all(boards.map(b =>
                        storagePutJSON(`_board-${b.id}.json`, { id: b.id, projectId: id, code: b.code, label: b.label, createdAt, versions: [] })
                    ));

                    shareToast.classList.add('hidden');
                    openProject(id, name);
                } catch (err) {
                    console.error('Create project failed:', err);
                    showShareToast('Could not create project — see console for details', true);
                }
            }

            document.getElementById('btn-new-project').addEventListener('click', () => {
                openModal({
                    title: 'New Project',
                    confirmText: 'Create Project',
                    focusSelector: '#modal-project-name',
                    bodyHtml: `
                        <label class="flex flex-col gap-1.5">
                            <span class="modal-label">Project Name</span>
                            <input id="modal-project-name" type="text" class="modal-input" placeholder="e.g. 123 Main St">
                        </label>
                        <label class="flex flex-col gap-1.5">
                            <span class="modal-label">Shot List</span>
                            <textarea id="modal-shot-list" rows="6" class="modal-input" style="resize:none;" placeholder="One shot per line, e.g.&#10;Living Room&#10;Kitchen&#10;Master Bedroom"></textarea>
                            <span class="text-[11px] text-gray-500">Each line becomes a shot (S010, S020, ...). You can add more later.</span>
                        </label>`,
                    onConfirm: async (body) => {
                        const name = body.querySelector('#modal-project-name').value.trim();
                        if (!name) { showShareToast('Project name is required', true); return false; }
                        const shotLabels = parseShotList(body.querySelector('#modal-shot-list').value);
                        await createProject(name, shotLabels);
                    }
                });
            });

            document.getElementById('btn-project-back').addEventListener('click', () => { showView('home'); renderHome(); });
            document.getElementById('btn-editor-back').addEventListener('click', () => { showView('project'); renderProject(); });

            async function openProject(id, name) {
                appState.projectId = id;
                appState.projectName = name;
                showView('project');
                await renderProject();
            }

            // --- Project view: shots (S010, S020, ...) ------------------------------------------
            const boardGrid = document.getElementById('board-grid');
            const boardEmpty = document.getElementById('board-empty');
            const projectTitle = document.getElementById('project-title');

            async function loadProject() {
                return await storageGetJSON(`_project-${appState.projectId}.json`);
            }

            async function renderProject() {
                projectTitle.textContent = appState.projectName;
                boardGrid.innerHTML = '';
                const project = await loadProject();
                if (!project) return;
                boardEmpty.classList.toggle('hidden', project.boards.length > 0);
                project.boards.forEach(b => {
                    const card = document.createElement('div');
                    card.className = 'board-card';
                    card.innerHTML = `
                        <div class="flex items-center gap-2 text-blue-400"><i class="fa-solid fa-image"></i></div>
                        <div class="text-sm font-semibold text-gray-100 truncate">${b.code}</div>
                        <div class="text-xs text-gray-400 truncate">${b.label || ''}</div>`;
                    card.addEventListener('click', () => openBoard(b));
                    boardGrid.appendChild(card);
                });
            }

            document.getElementById('btn-new-board').addEventListener('click', () => {
                openModal({
                    title: 'Add Shots',
                    confirmText: 'Add',
                    focusSelector: '#modal-shot-list',
                    bodyHtml: `
                        <label class="flex flex-col gap-1.5">
                            <span class="modal-label">Shot List</span>
                            <textarea id="modal-shot-list" rows="6" class="modal-input" style="resize:none;" placeholder="One shot per line"></textarea>
                        </label>`,
                    onConfirm: async (body) => {
                        const shotLabels = parseShotList(body.querySelector('#modal-shot-list').value);
                        if (shotLabels.length === 0) { showShareToast('Enter at least one shot name', true); return false; }
                        showShareToast('Adding shots…');
                        try {
                            const project = await loadProject();
                            const maxN = project.boards.reduce((m, b) => {
                                const n = parseInt((b.code || '').replace(/^S/i, ''), 10);
                                return isNaN(n) ? m : Math.max(m, n);
                            }, 0);
                            const createdAt = new Date().toISOString();
                            const newBoards = shotLabels.map((label, i) => ({
                                id: newId(), code: 'S' + String(maxN + (i + 1) * 10).padStart(3, '0'), label, createdAt
                            }));
                            project.boards.push(...newBoards);
                            await storagePutJSON(`_project-${appState.projectId}.json`, project);
                            await Promise.all(newBoards.map(b =>
                                storagePutJSON(`_board-${b.id}.json`, { id: b.id, projectId: appState.projectId, code: b.code, label: b.label, createdAt, versions: [] })
                            ));
                            shareToast.classList.add('hidden');
                            renderProject();
                        } catch (err) {
                            console.error('Add shots failed:', err);
                            showShareToast('Could not add shots — see console for details', true);
                            return false;
                        }
                    }
                });
            });

            function openBoard(b) {
                appState.boardId = b.id;
                appState.boardLabel = b.label ? `${b.code} — ${b.label}` : b.code;
                openBoardEditor();
            }

            // --- Editor: open/save the current shot's board -------------------------------------
            const editorBreadcrumb = document.getElementById('editor-breadcrumb');
            let currentBoardData = null;

            async function loadBoard() {
                return await storageGetJSON(`_board-${appState.boardId}.json`);
            }

            async function openBoardEditor() {
                showView('editor');
                editorBreadcrumb.textContent = `${appState.projectName} / ${appState.boardLabel}`;

                canvas.clear();
                calloutRegistry = {};
                internalClipboard = null;
                history = [];
                currentState = null;
                appState.versionId = null;

                showShareToast('Loading…');
                try {
                    currentBoardData = await loadBoard();
                    const versions = (currentBoardData && currentBoardData.versions) || [];
                    const latest = versions[versions.length - 1];
                    if (latest) {
                        const v = await storageGetJSON(`_version-${latest.id}.json`);
                        if (v && v.canvasJson) {
                            appState.versionId = latest.id;
                            canvas.loadFromJSON(v.canvasJson, function() {
                                canvas.renderAll();
                                rebuildCalloutRegistry();
                                currentState = JSON.stringify(v.canvasJson);
                                updateActionButtons();
                                shareToast.classList.add('hidden');
                            });
                        } else {
                            shareToast.classList.add('hidden');
                        }
                    } else {
                        canvas.renderAll();
                        updateActionButtons();
                        shareToast.classList.add('hidden');
                    }
                } catch (err) {
                    console.error('Load board failed:', err);
                    showShareToast('Could not load that shot', true);
                }
                renderHistoryPopup();
            }

            async function saveCurrentVersion() {
                if (!supabaseEnabled) {
                    showShareToast('Save is not configured yet — add your Supabase project config in index.html', true);
                    return;
                }
                if (!appState.boardId) return;
                showShareToast('Saving…');
                try {
                    const canvasJson = canvas.toJSON(['calloutId', 'calloutRole', 'tipX', 'tipY']);
                    const thumb = canvas.toDataURL({ format: 'png', multiplier: Math.min(1, 480 / canvas.getWidth()) });
                    const id = newId();
                    const savedAt = new Date().toISOString();

                    await storagePutJSON(`_version-${id}.json`, { canvasJson, savedAt });
                    await storagePutJSON(`_thumb-${id}.json`, { thumb, savedAt });

                    const board = await loadBoard();
                    board.versions.push({ id, savedAt });
                    await storagePutJSON(`_board-${appState.boardId}.json`, board);
                    currentBoardData = board;

                    appState.versionId = id;
                    currentState = JSON.stringify(canvasJson);
                    showShareToast('Saved');
                    renderHistoryPopup();
                } catch (err) {
                    console.error('Save failed:', err);
                    if (isStorageFullError(err)) {
                        showShareToast('Storage is full — delete some old versions to free up space, then try again.', true, 6000);
                    } else {
                        showShareToast('Save failed — see console for details', true);
                    }
                }
            }

            document.getElementById('btn-share').addEventListener('click', saveCurrentVersion);

            // --- Version history popup -----------------------------------------------------------
            const historyPopup = document.getElementById('history-popup');
            const btnHistory = document.getElementById('btn-history');

            function renderHistoryPopup() {
                historyPopup.innerHTML = '';
                const versions = (currentBoardData && currentBoardData.versions) || [];
                if (versions.length === 0) {
                    historyPopup.innerHTML = '<div class="history-item" style="cursor:default;">No saves yet</div>';
                    return;
                }
                versions.slice().reverse().forEach(v => {
                    const item = document.createElement('div');
                    item.className = 'history-item' + (v.id === appState.versionId ? ' current' : '');
                    item.innerHTML = `<span>${formatTimestamp(v.savedAt)}</span>${v.id === appState.versionId ? '<i class="fa-solid fa-check"></i>' : ''}`;
                    item.addEventListener('click', async () => {
                        historyPopup.classList.add('hidden');
                        showShareToast('Loading version…');
                        try {
                            const data = await storageGetJSON(`_version-${v.id}.json`);
                            if (data && data.canvasJson) {
                                canvas.clear();
                                calloutRegistry = {};
                                history = [];
                                appState.versionId = v.id;
                                canvas.loadFromJSON(data.canvasJson, function() {
                                    canvas.renderAll();
                                    rebuildCalloutRegistry();
                                    currentState = JSON.stringify(data.canvasJson);
                                    updateActionButtons();
                                    shareToast.classList.add('hidden');
                                    renderHistoryPopup();
                                });
                            }
                        } catch (err) {
                            console.error('Load version failed:', err);
                            showShareToast('Could not load that version', true);
                        }
                    });
                    historyPopup.appendChild(item);
                });
            }

            btnHistory.addEventListener('click', (e) => {
                e.stopPropagation();
                const wasHidden = historyPopup.classList.contains('hidden');
                historyPopup.classList.add('hidden');
                if (wasHidden) {
                    const rect = btnHistory.getBoundingClientRect();
                    historyPopup.style.top = `${rect.bottom + 6}px`;
                    historyPopup.style.left = `${rect.left}px`;
                    historyPopup.classList.remove('hidden');
                }
            });
            document.addEventListener('mousedown', (e) => {
                if (!historyPopup.classList.contains('hidden') && !historyPopup.contains(e.target) && e.target !== btnHistory && !btnHistory.contains(e.target)) {
                    historyPopup.classList.add('hidden');
                }
            });

            // Boot into the home view.
            showView('home');
            renderHome();

            // Arrow drawing state
            let isDrawingArrow = false;
            let arrowLine, arrowHead;

            // Callout drawing state — click-drag-release: mouse down plants the tip (anchored,
            // never moves again), drag previews the arrow, release drops the note box there.
            let isDrawingCallout = false;
            let calloutLine, calloutHead, calloutBox, activeShape;
            // calloutId -> { leg1, leg2, head, frame, box }. A kinked (Acrobat-style) two-segment
            // leader: leg1 runs from the fixed tip to a "knee", leg2 from the knee into the box's
            // edge. `frame` is the box's visible background+border (never the text itself — a
            // Textbox's own `stroke` styles its glyphs, not a border, which is why that looked bad).
            // Tip lives at leg1.tipX/tipY (fixed) — NOT leg1.x1/y1: Fabric silently rewrites a
            // Line's x1/y1/x2/y2 to be relative to its own center on a toJSON/loadFromJSON
            // round-trip, so anything read across an undo needs its own tag.
            let calloutRegistry = {};
            let calloutCounter = 0;
            let calloutStickies = []; // callouts dragged along with an underlying image

            // Hand-rolled drag state for grabbing a callout's leader (moves everything rigidly)
            // or its arrowhead (repositions just the tip) — see the mouse:down handler.
            let isDraggingCalloutRigid = false;
            let rigidDragEntry = null, rigidDragStart = null, rigidDragOriginal = null;
            let isDraggingCalloutTip = false;
            let tipDragEntry = null;
            // Grabbing the frame (the padded card background behind the tight text box) drags
            // the box exactly like grabbing the box itself — tip anchored, arrow re-angles.
            let isDraggingCalloutFrame = false;
            let frameDragEntry = null, frameDragStart = null, frameDragOriginalBox = null;

            // Hand-rolled drag for a CompareSlider's divider handle — see hitTestCompareHandle()
            // for why this can't just be the object's own fabric Control.
            let isDraggingCompareHandle = false;
            let compareDragTarget = null;

            // "Pick a partner" flow: clicking Compare with just one image selected arms this,
            // and the next click on a DIFFERENT image completes the pair (any other click —
            // same image again, empty canvas, Escape — cancels it).
            let isPickingCompareTarget = false;
            let comparePickSource = null;
            let comparePickHoverTarget = null;

            // Polygon drawing state
            let polyPoints = [];
            let polyLines = [];
            let activePolyLine = null;

            // Shape Drawing (Drag-to-size) State
            let isDrawingShape = false;
            let shapeStart = { x: 0, y: 0 };
            
            // Sticky annotations state
            let stickyOffsets = [];
            let isDraggingSticky = false;

            // Smart-guide style alignment snap (InDesign/Photoshop style) — always on, applied
            // only while dragging an image, against other objects' edges/centers. No UI toggle.
            let guideLines = [];
            let activeGuideTypes = [];

            function drawGuide(type, pos) {
                const color = '#3b82f6'; 
                let line;
                const zoom = canvas.getZoom();
                
                if (type === 'vertical') {
                    line = new fabric.Line([pos, -99999, pos, 99999], {
                        stroke: color, strokeWidth: 1 / zoom, selectable: false, evented: false, strokeDashArray: [5, 5]
                    });
                } else {
                    line = new fabric.Line([-99999, pos, 99999, pos], {
                        stroke: color, strokeWidth: 1 / zoom, selectable: false, evented: false, strokeDashArray: [5, 5]
                    });
                }
                canvas.add(line);
                guideLines.push(line);
                activeGuideTypes.push(type);
                line.moveTo(canvas.getObjects().length); 
            }

            function clearGuidelines() {
                guideLines.forEach(l => canvas.remove(l));
                guideLines = [];
                activeGuideTypes = [];
            }

            function snapToObjects(activeObj) {
                // Ignore snapping to lines, callout leader/arrowhead parts, the active object, or active guides
                const canvasObjects = canvas.getObjects().filter(o =>
                    o !== activeObj && !guideLines.includes(o) && o.type !== 'line' &&
                    o.calloutRole !== 'head'
                );
                if (canvasObjects.length === 0) return { snappedX: false, snappedY: false };

                // Force a coords refresh first — getBoundingRect(true) can otherwise return a
                // stale, one-frame-behind rect while dragging, which made the snap target drift
                // instead of lock (the main cause of the jittery feel).
                activeObj.setCoords();
                const objB = activeObj.getBoundingRect(true); // true = raw canvas coords, ignoring pan/zoom

                // Constant on-screen snap distance regardless of zoom level (Photoshop/InDesign-style)
                const threshold = 10 / canvas.getZoom();

                let snapX = null;
                let snapY = null;
                let minDiffX = threshold;
                let minDiffY = threshold;
                let lineX = null;
                let lineY = null;

                const activeEdgesX = [
                    { type: 'left', val: objB.left },
                    { type: 'center', val: objB.left + objB.width / 2 },
                    { type: 'right', val: objB.left + objB.width }
                ];
                const activeEdgesY = [
                    { type: 'top', val: objB.top },
                    { type: 'center', val: objB.top + objB.height / 2 },
                    { type: 'bottom', val: objB.top + objB.height }
                ];

                canvasObjects.forEach(target => {
                    const targetB = target.getBoundingRect(true);
                    const targetEdgesX = [
                        { type: 'left', val: targetB.left },
                        { type: 'center', val: targetB.left + targetB.width / 2 },
                        { type: 'right', val: targetB.left + targetB.width }
                    ];
                    const targetEdgesY = [
                        { type: 'top', val: targetB.top },
                        { type: 'center', val: targetB.top + targetB.height / 2 },
                        { type: 'bottom', val: targetB.top + targetB.height }
                    ];

                    activeEdgesX.forEach(aEdge => {
                        targetEdgesX.forEach(tEdge => {
                            if (aEdge.type !== tEdge.type) return;
                            const diff = Math.abs(aEdge.val - tEdge.val);
                            if (diff < minDiffX) {
                                minDiffX = diff;
                                if (aEdge.type === 'left') snapX = tEdge.val;
                                if (aEdge.type === 'center') snapX = tEdge.val - objB.width / 2;
                                if (aEdge.type === 'right') snapX = tEdge.val - objB.width;
                                lineX = tEdge.val;
                            }
                        });
                    });

                    activeEdgesY.forEach(aEdge => {
                        targetEdgesY.forEach(tEdge => {
                            if (aEdge.type !== tEdge.type) return;
                            const diff = Math.abs(aEdge.val - tEdge.val);
                            if (diff < minDiffY) {
                                minDiffY = diff;
                                if (aEdge.type === 'top') snapY = tEdge.val;
                                if (aEdge.type === 'center') snapY = tEdge.val - objB.height / 2;
                                if (aEdge.type === 'bottom') snapY = tEdge.val - objB.height;
                                lineY = tEdge.val;
                            }
                        });
                    });
                });

                let snappedX = false;
                let snappedY = false;

                // Apply adjustments preserving object origin offsets
                if (snapX !== null) {
                    activeObj.set('left', snapX + (activeObj.left - objB.left));
                    drawGuide('vertical', lineX);
                    snappedX = true;
                }
                if (snapY !== null) {
                    activeObj.set('top', snapY + (activeObj.top - objB.top));
                    drawGuide('horizontal', lineY);
                    snappedY = true;
                }
                if (snappedX || snappedY) activeObj.setCoords();
                return { snappedX, snappedY };
            }

            // Arrowhead (and callout tip) triangle size for a given stroke weight — floored so
            // thin lines still get a decently sized, easy-to-grab head.
            function arrowHeadSize(width) {
                return Math.max(width * 6, 26);
            }

            // --- Callout geometry helpers -------------------------------------------------

            // Fabric's Textbox `padding` only affects selection-handle spacing, not layout — it
            // adds no real space around the text. To get an actual bled, breathing-room card, the
            // frame is sized as the text's tight bounding box PLUS this margin on every side.
            const CALLOUT_PADDING = 16;

            // New callouts default to white outline/leader/arrowhead regardless of the shared
            // color picker — they read as a clean note against a photo. Still fully customizable
            // afterward via syncCalloutColor().
            const CALLOUT_DEFAULT_COLOR = '#ffffff';

            // --- Compare Slider (before/after image comparison) ----------------------------
            //
            // A single custom fabric.Object subclass — NOT a fabric.Group of separately
            // tracked parts (the pattern `calloutRegistry` uses, which caused real bugs this
            // session because align/distribute/multi-select code has to remember to keep every
            // sibling part in sync by hand). Being one object means move/scale/delete/multi-
            // select and canvas.toJSON()/loadFromJSON() (undo/redo) all just work the same way
            // they do for any other shape, with no registry to maintain.
            //
            // Both source images are drawn CROPPED-TO-FILL (like CSS `object-fit: cover`)
            // rather than letterboxed. Tradeoff: content near the edges of an image whose
            // aspect ratio doesn't match the widget can get cropped off, but there are no
            // mismatched-color bars, and — since the crop is recomputed fresh from the
            // widget's current on-screen size on every render — resizing the widget (even
            // non-uniformly, by dragging a side handle) never stretches/distorts either image;
            // it only changes how much of each image's edges are cropped.
            fabric.CompareSlider = fabric.util.createClass(fabric.Object, {
                type: 'compareSlider',

                // Custom _render below recomputes the crop from the object's OWN current
                // scale every frame (see the ctx.scale(1/scaleX, 1/scaleY) note there) —
                // fabric's object cache would instead pre-render once at scale 1 and stretch
                // the cached bitmap, silently undoing that compensation. Not worth caching
                // anyway: this is a rarely-numerous, interactively-edited widget, not a
                // large static shape.
                objectCaching: false,

                initialize: function(imgAEl, imgBEl, options) {
                    options = options || {};
                    this.imgAEl = imgAEl;
                    this.imgBEl = imgBEl;
                    this.imgASrc = options.imgASrc || (imgAEl && imgAEl.src) || '';
                    this.imgBSrc = options.imgBSrc || (imgBEl && imgBEl.src) || '';
                    this.imgAName = options.imgAName || '';
                    this.imgBName = options.imgBName || '';
                    this.divider = options.divider !== undefined ? options.divider : 0.5;
                    this.callSuper('initialize', options);
                },

                // Crops `img` to fill a dw×dh box without distorting it (CSS object-fit: cover),
                // then draws it at (dx, dy) in the CALLER's current (already-transformed) space.
                _drawCover: function(ctx, img, dx, dy, dw, dh) {
                    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
                    if (!iw || !ih || dw <= 0 || dh <= 0) return;
                    const srcAspect = iw / ih, dstAspect = dw / dh;
                    let sx, sy, sw, sh;
                    if (srcAspect > dstAspect) {
                        sh = ih; sw = ih * dstAspect; sx = (iw - sw) / 2; sy = 0;
                    } else {
                        sw = iw; sh = iw / dstAspect; sx = 0; sy = (ih - sh) / 2;
                    }
                    ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
                },

                // A small translucent tag pinned to a bottom corner, so it's always clear which
                // source image is which even after the widget's been moved/resized far from the
                // originals — name on top, its pixel resolution in smaller text below. `align`
                // picks which corner (x, y) is: 'left' grows the tag rightward from x, 'right'
                // grows it leftward.
                _drawNameLabel: function(ctx, text, resText, h, x, y, align) {
                    if (!text) return;
                    const fontSize = Math.max(10, Math.min(15, h * 0.045));
                    const resFontSize = fontSize * 0.78;
                    ctx.save();
                    ctx.textBaseline = 'alphabetic';
                    ctx.textAlign = 'left';

                    const padX = fontSize * 0.55, padY = fontSize * 0.38;
                    const lineGap = fontSize * 0.2;

                    ctx.font = `600 ${fontSize}px Inter, sans-serif`;
                    const nameWidth = ctx.measureText(text).width;
                    ctx.font = `500 ${resFontSize}px Inter, sans-serif`;
                    const resWidth = resText ? ctx.measureText(resText).width : 0;

                    const boxW = Math.max(nameWidth, resWidth) + padX * 2;
                    const boxH = fontSize + padY * 2 + (resText ? lineGap + resFontSize : 0);
                    const boxX = align === 'left' ? x : x - boxW;
                    const boxY = y - boxH;

                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(boxX, boxY, boxW, boxH, 4);
                    else ctx.rect(boxX, boxY, boxW, boxH);
                    ctx.fillStyle = 'rgba(0,0,0,0.55)';
                    ctx.fill();

                    ctx.font = `600 ${fontSize}px Inter, sans-serif`;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText(text, boxX + padX, boxY + padY + fontSize * 0.82);

                    if (resText) {
                        ctx.font = `500 ${resFontSize}px Inter, sans-serif`;
                        ctx.fillStyle = 'rgba(255,255,255,0.75)';
                        ctx.fillText(resText, boxX + padX, boxY + padY + fontSize + lineGap + resFontSize * 0.78);
                    }
                    ctx.restore();
                },

                // The divider grip: a horizontal pill (not a plain dot) with a pair of inward-
                // facing chevrons baked in, so it visibly reads as a drag-to-compare control
                // rather than just a decorative marker. Drawn slightly see-through (globalAlpha)
                // so it reads as an overlay control rather than opaque widget chrome, matching
                // how similar grab handles look in other image-compare UIs.
                _drawHandle: function(ctx, cx, cy, r, color) {
                    const w = r * 2.8, h = r * 1.8, rad = h / 2;

                    // Soft drop shadow first, in its own save/restore so it doesn't smear onto
                    // the fill/stroke/chevrons drawn after it.
                    ctx.save();
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(cx - w / 2, cy - h / 2, w, h, rad);
                    else ctx.rect(cx - w / 2, cy - h / 2, w, h);
                    ctx.shadowColor = 'rgba(0,0,0,0.45)';
                    ctx.shadowBlur = r * 0.9;
                    ctx.shadowOffsetY = r * 0.15;
                    ctx.fillStyle = 'rgba(0,0,0,0.001)';
                    ctx.fill();
                    ctx.restore();

                    ctx.save();
                    ctx.globalAlpha = 0.92;
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(cx - w / 2, cy - h / 2, w, h, rad);
                    else ctx.rect(cx - w / 2, cy - h / 2, w, h);

                    // Subtle vertical gradient instead of a flat fill reads as a proper 3D grip
                    // rather than a flat sticker pasted on the image.
                    const grad = ctx.createLinearGradient(0, cy - h / 2, 0, cy + h / 2);
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(1, '#e2e8f0');
                    ctx.fillStyle = grad;
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(15,23,42,0.18)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    ctx.restore();

                    ctx.save();
                    ctx.strokeStyle = 'rgba(30,41,59,0.75)';
                    ctx.lineWidth = Math.max(1.4, h * 0.12);
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    const armW = h * 0.2, armH = h * 0.24, gap = w * 0.19;

                    ctx.beginPath();
                    ctx.moveTo(cx - gap + armW, cy - armH);
                    ctx.lineTo(cx - gap, cy);
                    ctx.lineTo(cx - gap + armW, cy + armH);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(cx + gap - armW, cy - armH);
                    ctx.lineTo(cx + gap, cy);
                    ctx.lineTo(cx + gap - armW, cy + armH);
                    ctx.stroke();

                    ctx.restore();
                },

                _render: function(ctx) {
                    const scaleX = this.scaleX || 1, scaleY = this.scaleY || 1;
                    ctx.save();
                    // Fabric already applied this object's own scaleX/scaleY to the context
                    // before calling _render. Undo that here and redraw everything in final
