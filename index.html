                    // on-screen pixel units instead — otherwise a non-uniform resize (a side
                    // handle, scaleX !== scaleY) would stretch the cropped images into ellipses
                    // rather than just cropping more/less, and the divider/handle stroke would
                    // thin out under scale exactly like the bug fixed elsewhere in this file
                    // (see the strokeUniform notes on the other shapes).
                    ctx.scale(1 / scaleX, 1 / scaleY);

                    const w = this.width * scaleX, h = this.height * scaleY;
                    const left = -w / 2, top = -h / 2;

                    // Image B's name tag is drawn right on top of it, BEFORE image A's clipped
                    // layer goes down — so as the divider slides toward B's side, A's own
                    // (opaque) pixels paint over the tag exactly the way they paint over the rest
                    // of B, hiding it. Image A's tag is drawn inside A's own clip region for the
                    // mirror case: sliding the divider away from A shrinks that clip until the
                    // tag itself falls outside it and disappears.
                    const describeRes = (img) => {
                        if (!img) return '';
                        const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
                        return ih ? `${iw} × ${ih} · ${(iw / ih).toFixed(2)}` : `${iw} × ${ih}`;
                    };
                    const resA = describeRes(this.imgAEl);
                    const resB = describeRes(this.imgBEl);

                    if (this.imgBEl) this._drawCover(ctx, this.imgBEl, left, top, w, h);
                    this._drawNameLabel(ctx, this.imgBName, resB, h, left + w - 6, top + h - 6, 'right');

                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(left, top, w * this.divider, h);
                    ctx.clip();
                    if (this.imgAEl) this._drawCover(ctx, this.imgAEl, left, top, w, h);
                    this._drawNameLabel(ctx, this.imgAName, resA, h, left + 6, top + h - 6, 'left');
                    ctx.restore();

                    // Divider line + handle re-use the shared stroke/strokeWidth properties —
                    // the app's existing color-picker and weight-slider handlers already fall
                    // through to plain `stroke`/`strokeWidth` for any object type they don't
                    // otherwise recognize, so this widget gets toolbar sync for free.
                    const dx = left + w * this.divider;
                    const strokeColor = this.stroke || CALLOUT_DEFAULT_COLOR;
                    const weight = Math.max(1, this.strokeWidth || 2);

                    // Soft shadow under the line so it stays visible crossing both light and
                    // dark image content, then the actual color line on top.
                    ctx.save();
                    ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    ctx.shadowBlur = Math.max(3, weight * 1.5);
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = weight;
                    ctx.beginPath();
                    ctx.moveTo(dx, top);
                    ctx.lineTo(dx, top + h);
                    ctx.stroke();
                    ctx.restore();

                    const handleR = Math.max(13, weight * 2.4);
                    this._drawHandle(ctx, dx, top + h / 2, handleR, strokeColor);

                    ctx.restore();
                },

                toObject: function(propertiesToInclude) {
                    return fabric.util.object.extend(this.callSuper('toObject', propertiesToInclude), {
                        divider: this.divider,
                        imgASrc: this.imgASrc,
                        imgBSrc: this.imgBSrc,
                        imgAName: this.imgAName,
                        imgBName: this.imgBName
                    });
                }
            });

            // Async reconstruction on canvas.loadFromJSON (undo/redo, and any future save/load)
            // — the same pattern fabric.Image.fromObject itself uses for its own async image
            // loading, so it plugs into loadFromJSON's existing multi-object async wait with no
            // changes needed anywhere else.
            fabric.CompareSlider.fromObject = function(object, callback) {
                fabric.util.loadImage(object.imgASrc, function(imgAEl) {
                    fabric.util.loadImage(object.imgBSrc, function(imgBEl) {
                        callback(new fabric.CompareSlider(imgAEl, imgBEl, object));
                    });
                });
            };

            // Custom control for the draggable divider handle. This reuses fabric's own control
            // hit-testing/drag lifecycle (positionHandler/actionHandler) instead of hand-rolled
            // canvas mouse-event tracking — it's only live while this object alone is the active
            // selection, so it can never be confused with an activeSelection drag. The visible
            // handle graphic is already baked into _render above (so it's always visible, even
            // unselected); this control only supplies the drag hit-region + cursor, so its own
            // `render` is a no-op to avoid drawing a second, potentially-misaligned circle.
            fabric.CompareSlider.prototype.controls = Object.assign({}, fabric.Object.prototype.controls, {
                dividerHandle: new fabric.Control({
                    positionHandler: function(dim, finalMatrix, fabricObject) {
                        // Mirrors the default corner-control math (this.x * dim.x, y: 0) but
                        // with a dynamic fraction instead of a fixed corner — dim.x is already
                        // the object's on-screen width (raw width * scaleX, zoom-corrected).
                        const point = new fabric.Point((fabricObject.divider - 0.5) * dim.x, 0);
                        return fabric.util.transformPoint(point, finalMatrix);
                    },
                    actionHandler: function(eventData, transform, x, y) {
                        const target = transform.target;
                        // toLocalPoint rotates+translates into the object's local axes but does
                        // NOT divide out scale, so it ranges over ±(width*scaleX)/2 — matching
                        // positionHandler's own dim.x convention above.
                        const localPoint = target.toLocalPoint(new fabric.Point(x, y), 'center', 'center');
                        const scaledWidth = target.width * (target.scaleX || 1);
                        let frac = scaledWidth ? (localPoint.x / scaledWidth + 0.5) : 0.5;
                        frac = Math.max(0.015, Math.min(0.985, frac));
                        if (target.divider !== frac) target.set('divider', frac);
                        return true;
                    },
                    cursorStyleHandler: function() { return 'ew-resize'; },
                    render: function() {},
                    // Roomier than fabric's default corner hit box (13px) to match the wider
                    // pill-shaped handle drawn in _render.
                    sizeX: 46,
                    sizeY: 30,
                    actionName: 'modifyDivider'
                })
            });

            // While an object is part of a multi-selection (ActiveSelection), Fabric rewrites
            // its left/top — and therefore getBoundingRect()'s position — to be relative to the
            // selection's own center instead of the canvas. Width/height stay correct; only the
            // position is wrong. calcTransformMatrix() correctly composes the full parent chain
            // regardless of grouping, so use that to recover the true canvas-absolute position.
            // Without this, editing a callout's box while multiple callouts are selected together
            // (e.g. changing stroke weight for all of them at once) sends the frame/leader flying
            // to a wrong spot on screen.
            function getAbsoluteBoundingRect(obj) {
                const rect = obj.getBoundingRect(true);
                if (!obj.group) return rect;
                const absCenter = fabric.util.transformPoint({ x: 0, y: 0 }, obj.calcTransformMatrix());
                return {
                    left: absCenter.x - rect.width / 2,
                    top: absCenter.y - rect.height / 2,
                    width: rect.width,
                    height: rect.height
                };
            }

            // Fabric only honors a control's own actionHandler (our dividerHandle drag) on an
            // object that was ALREADY the active selection before this click — a fresh click on
            // an unselected-but-selectable object always falls back to a plain move, no matter
            // where on it you click (confirmed against fabric's own _setupCurrentTransform: the
            // alreadySelected flag gates which actionHandler gets used). That would force a
            // select-then-drag two-step just to use the slider, so this hand-rolled hit-test lets
            // a single click-drag land on the handle even the very first time — same trick this
            // file already uses for the callout leader/frame (see the mouse:down handler below).
            function hitTestCompareHandle(obj, pointer) {
                if (obj.type !== 'compareSlider') return false;
                const weight = Math.max(1, obj.strokeWidth || 2);
                const handleR = Math.max(13, weight * 2.4);
                // Matches the pill footprint _drawHandle() actually draws — see the scale-
                // neutralization note in _render(): because that math cancels the object's own
                // scaleX/scaleY, the handle's rendered size in canvas-world units is exactly
                // handleR-derived, independent of the object's current scale.
                const halfW = (handleR * 2.8) / 2 + 6, halfH = (handleR * 1.8) / 2 + 6;

                // (divider - 0.5) * width is the handle's position in the object's own RAW
                // (unscaled) local coordinate space — calcTransformMatrix() maps that straight to
                // true canvas/world coordinates, the same space canvas.getPointer() returns.
                const localPoint = new fabric.Point((obj.divider - 0.5) * obj.width, 0);
                const handlePos = fabric.util.transformPoint(localPoint, obj.calcTransformMatrix());

                const angle = fabric.util.degreesToRadians(obj.angle || 0);
                const dx = pointer.x - handlePos.x, dy = pointer.y - handlePos.y;
                const cos = Math.cos(-angle), sin = Math.sin(-angle);
                const localDx = dx * cos - dy * sin, localDy = dx * sin + dy * cos;
                return Math.abs(localDx) <= halfW && Math.abs(localDy) <= halfH;
            }

            function getCalloutFrameRect(box) {
                const rect = getAbsoluteBoundingRect(box);
                const p = CALLOUT_PADDING;
                return { left: rect.left - p, top: rect.top - p, width: rect.width + p * 2, height: rect.height + p * 2 };
            }

            // Where to park a callout's box (its CENTER, since box uses originX/Y: 'center') so
            // the whole card sits completely outside imgBounds, with some wiggle room. Picks
            // whichever of the 4 edges (left/right/top/bottom) the click is actually closest to
            // — always, even if that edge is tight against the canvas boundary. (An earlier
            // version skipped a side that didn't have ~100px of clearance on screen, but since
            // images are almost always placed just below the toolbar, "top" rarely had that much
            // headroom and this silently fell back to left/right every time.)
            function computeOffImagePosition(imgBounds, refX, refY) {
                const margin = 40; // wiggle room between the image edge and the card
                const frameWidthEstimate = 190 + CALLOUT_PADDING * 2;
                const frameHeightEstimate = 60; // rough single-line default text + padding
                const halfFrameWidth = frameWidthEstimate / 2;
                const halfFrameHeight = frameHeightEstimate / 2;

                const distances = [
                    { side: 'left', dist: refX - imgBounds.left },
                    { side: 'right', dist: imgBounds.left + imgBounds.width - refX },
                    { side: 'top', dist: refY - imgBounds.top },
                    { side: 'bottom', dist: imgBounds.top + imgBounds.height - refY }
                ].sort((a, b) => a.dist - b.dist);

                const side = distances[0].side;

                let dropX, dropY;
                if (side === 'left' || side === 'right') {
                    dropX = side === 'right'
                        ? imgBounds.left + imgBounds.width + margin + halfFrameWidth
                        : imgBounds.left - margin - halfFrameWidth;
                    dropY = Math.min(Math.max(refY, imgBounds.top + 40), imgBounds.top + imgBounds.height - 40);
                } else {
                    dropY = side === 'bottom'
                        ? imgBounds.top + imgBounds.height + margin + halfFrameHeight
                        : imgBounds.top - margin - halfFrameHeight;
                    dropX = Math.min(Math.max(refX, imgBounds.left + 40), imgBounds.left + imgBounds.width - 40);
                }
                return { dropX, dropY, side };
            }

            // Which edge of the image a callout's card is currently parked against, inferred
            // from its own position (so we don't need to persist this anywhere).
            function classifyCalloutSide(entry, imgBounds) {
                const frameRect = getCalloutFrameRect(entry.box);
                const cx = frameRect.left + frameRect.width / 2;
                const cy = frameRect.top + frameRect.height / 2;
                if (cx < imgBounds.left) return 'left';
                if (cx > imgBounds.left + imgBounds.width) return 'right';
                if (cy < imgBounds.top) return 'top';
                if (cy > imgBounds.top + imgBounds.height) return 'bottom';
                return null;
            }

            // Whenever a new callout is auto-parked against an edge of an image, re-stack EVERY
            // callout already on that same edge in tip order — otherwise a later callout can
            // land ahead of an earlier one whose tip is actually further along, and their leader
            // lines cross. Each box still prefers to sit level with its own tip; it only gets
            // pushed past whatever's already there ahead of it.
            function relayoutCalloutsForImageEdge(image, side) {
                const imgBounds = image.getBoundingRect(true);
                const edgeEntries = Object.values(calloutRegistry).filter(entry => {
                    if (!entry.box || !entry.leg1 || !entry.frame) return false;
                    if (!pointInRect(entry.leg1.tipX, entry.leg1.tipY, imgBounds)) return false;
                    return classifyCalloutSide(entry, imgBounds) === side;
                });
                if (edgeEntries.length < 2) return;

                const gap = 8;
                if (side === 'left' || side === 'right') {
                    edgeEntries.sort((a, b) => a.leg1.tipY - b.leg1.tipY);
                    let prevBottom = imgBounds.top + 40;
                    edgeEntries.forEach(entry => {
                        const half = getCalloutFrameRect(entry.box).height / 2;
                        const center = Math.max(entry.leg1.tipY, prevBottom + half);
                        entry.box.set({ top: center });
                        entry.box.setCoords();
                        updateCalloutGeometry(entry);
                        prevBottom = center + half + gap;
                    });
                } else {
                    edgeEntries.sort((a, b) => a.leg1.tipX - b.leg1.tipX);
                    let prevRight = imgBounds.left + 40;
                    edgeEntries.forEach(entry => {
                        const half = getCalloutFrameRect(entry.box).width / 2;
                        const center = Math.max(entry.leg1.tipX, prevRight + half);
                        entry.box.set({ left: center });
                        entry.box.setCoords();
                        updateCalloutGeometry(entry);
                        prevRight = center + half + gap;
                    });
                }
            }

            // Kinked (Acrobat-style) leader geometry: a diagonal leg from the tip to a "knee",
            // then a level leg straight into one edge of the note — instead of one diagonal
            // line running straight into the middle of the note. The note can now sit beside
            // (left/right) OR above/below the image, so pick whichever pair of edges actually
            // separates the tip from the box: the axis with the bigger outside gap.
            function getCalloutKinkPoints(frameRect, tip) {
                const rect = frameRect;
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const horizontalGap = tip.x < rect.left ? rect.left - tip.x
                    : (tip.x > rect.left + rect.width ? tip.x - (rect.left + rect.width) : 0);
                const verticalGap = tip.y < rect.top ? rect.top - tip.y
                    : (tip.y > rect.top + rect.height ? tip.y - (rect.top + rect.height) : 0);

                if (horizontalGap >= verticalGap) {
                    const onLeft = tip.x < cx;
                    const anchorX = onLeft ? rect.left : rect.left + rect.width;
                    const margin = Math.min(14, rect.height / 2);
                    const anchorY = Math.max(rect.top + margin, Math.min(rect.top + rect.height - margin, tip.y));
                    // Scale the level "flag" segment with distance so the kink stays visible on
                    // long leaders instead of shrinking to an imperceptible sliver next to the box.
                    const dist = Math.abs(anchorX - tip.x);
                    const legLength = Math.min(80, Math.max(28, dist * 0.35));
                    const knee = { x: onLeft ? anchorX - legLength : anchorX + legLength, y: anchorY };
                    return { anchor: { x: anchorX, y: anchorY }, knee };
                } else {
                    const onTop = tip.y < cy;
                    const anchorY = onTop ? rect.top : rect.top + rect.height;
                    const margin = Math.min(14, rect.width / 2);
                    const anchorX = Math.max(rect.left + margin, Math.min(rect.left + rect.width - margin, tip.x));
                    const dist = Math.abs(anchorY - tip.y);
                    const legLength = Math.min(80, Math.max(28, dist * 0.35));
                    const knee = { x: anchorX, y: onTop ? anchorY - legLength : anchorY + legLength };
                    return { anchor: { x: anchorX, y: anchorY }, knee };
                }
            }

            // Re-anchor the leader/arrowhead/frame to the box's current position and size,
            // keeping the tip fixed. Called on every box move/resize/text-edit.
            function updateCalloutGeometry(entry) {
                if (!entry || !entry.leg1 || !entry.leg2 || !entry.head || !entry.box || !entry.frame) return;
                const tip = { x: entry.leg1.tipX, y: entry.leg1.tipY };
                const frameRect = getCalloutFrameRect(entry.box);
                const { anchor, knee } = getCalloutKinkPoints(frameRect, tip);

                // Re-assert x1/y1 as absolute too, self-healing the line after any reload
                entry.leg1.set({ x1: tip.x, y1: tip.y, x2: knee.x, y2: knee.y });
                entry.leg1.setCoords();
                entry.leg2.set({ x1: knee.x, y1: knee.y, x2: anchor.x, y2: anchor.y });
                entry.leg2.setCoords();

                const dx = tip.x - knee.x;
                const dy = tip.y - knee.y;
                const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                entry.head.set({ left: tip.x, top: tip.y, angle: angle + 90 });
                entry.head.setCoords();

                // Frame tracks the box's tight text box plus real padding (axis-aligned), so the
                // background+border always bleeds edge-to-edge around the text with breathing
                // room, instead of hugging the text lines the way Textbox's own backgroundColor
                // (or its non-functional `padding`) would. Left/top are NOT stroke-compensated
                // here — the canvas stroke is centered on this path regardless, so shifting the
                // path itself would only throw off the padding's symmetry around the text.
                entry.frame.set({
                    left: frameRect.left, top: frameRect.top, width: frameRect.width, height: frameRect.height,
                    scaleX: 1, scaleY: 1, angle: 0
                });
                entry.frame.setCoords();
            }

            function rectsOverlap(a, b) {
                return !(a.left + a.width <= b.left || b.left + b.width <= a.left ||
                         a.top + a.height <= b.top || b.top + b.height <= a.top);
            }

            function pointInRect(x, y, r) {
                return x >= r.left && x <= r.left + r.width && y >= r.top && y <= r.top + r.height;
            }

            // Nudge a callout box away from any other callout box it now overlaps, then
            // re-angle its line/arrowhead to match — called when a callout drag is released.
            function resolveCalloutOverlap(movedEntry) {
                if (!movedEntry || !movedEntry.box) return;
                const others = Object.values(calloutRegistry).filter(e => e.box && e.box !== movedEntry.box);
                const gap = 8; // breathing room between adjacent cards
                let guard = 0;
                while (guard < 200) {
                    const rect = getCalloutFrameRect(movedEntry.box);
                    const collision = others.find(e => rectsOverlap(rect, getCalloutFrameRect(e.box)));
                    if (!collision) break;
                    const otherRect = getCalloutFrameRect(collision.box);
                    const dx = (rect.left + rect.width / 2) - (otherRect.left + otherRect.width / 2);
                    const dy = (rect.top + rect.height / 2) - (otherRect.top + otherRect.height / 2);
                    // Callouts parked outside the same image share the exact same dropX (see
                    // computeOffImagePosition), so dx is routinely exactly 0 — never resolve
                    // that case horizontally (it would walk the box back toward the image);
                    // jump vertically past the colliding card instead. Whichever axis it
                    // resolves on, jump the EXACT distance needed to fully clear that card in
                    // one step — a small fixed nudge (the old approach) could take more steps
                    // than the guard allows once several cards are already stacked, leaving
                    // visible overlap behind.
                    if (dx === 0) {
                        const dir = dy >= 0 ? 1 : -1;
                        const needed = otherRect.height / 2 + rect.height / 2 + gap;
                        movedEntry.box.set({ top: movedEntry.box.top + (dir * needed - dy) });
                    } else {
                        const dir = dx >= 0 ? 1 : -1;
                        const needed = otherRect.width / 2 + rect.width / 2 + gap;
                        movedEntry.box.set({ left: movedEntry.box.left + (dir * needed - dx) });
                    }
                    movedEntry.box.setCoords();
                    guard++;
                }
                updateCalloutGeometry(movedEntry);
            }

            // Custom calloutId/calloutRole properties don't survive object identity across an
            // undo (canvas.loadFromJSON rebuilds fresh objects), so relink them by tag.
            function rebuildCalloutRegistry() {
                calloutRegistry = {};
                canvas.getObjects().forEach(obj => {
                    if (!obj.calloutId || !obj.calloutRole) return;
                    if (!calloutRegistry[obj.calloutId]) calloutRegistry[obj.calloutId] = {};
                    calloutRegistry[obj.calloutId][obj.calloutRole] = obj;
                });
            }

            // Leader/arrowhead/border color — the shared "Color" swatch. Background fill and
            // text color are independent (syncCalloutBgColor / syncCalloutFontColor below).
            function syncCalloutColor(calloutId, color) {
                const entry = calloutRegistry[calloutId];
                if (!entry) return;
                if (entry.leg1) entry.leg1.set({ stroke: color, fill: color });
                if (entry.leg2) entry.leg2.set({ stroke: color, fill: color });
                if (entry.head) entry.head.set({ fill: color });
                if (entry.frame) entry.frame.set({ stroke: color });
            }

            // Pulls the r/g/b out of whatever's currently on the frame's fill (an rgba() string)
            // so a change to just ONE of {color, opacity} doesn't clobber the other.
            function calloutFrameRgb(entry) {
                const fallback = { r: 255, g: 255, b: 255 };
                if (!entry.frame || typeof entry.frame.fill !== 'string') return fallback;
                const m = entry.frame.fill.match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
                return m ? { r: +m[1], g: +m[2], b: +m[3] } : fallback;
            }

            function hexToRgb(hex) {
                const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
                return m ? { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) } : { r: 255, g: 255, b: 255 };
            }

            function rgbToHex({ r, g, b }) {
                const c = v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0');
                return `#${c(r)}${c(g)}${c(b)}`;
            }

            // The card's background fill lives on the frame (never the text itself) and its
            // color/opacity are set independently, so both compose into one rgba() string —
            // reading the other's current value back out each time keeps them from clobbering.
            function syncCalloutBgColor(calloutId, hex) {
                const entry = calloutRegistry[calloutId];
                if (!entry || !entry.frame) return;
                const rgb = hexToRgb(hex);
                const alphaMatch = typeof entry.frame.fill === 'string' ? entry.frame.fill.match(/,\s*([\d.]+)\)\s*$/) : null;
                const alpha = alphaMatch ? parseFloat(alphaMatch[1]) : currentOpacity;
                entry.frame.set({ fill: `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${alpha})` });
            }

            function syncCalloutFontColor(calloutId, hex) {
                const entry = calloutRegistry[calloutId];
                if (!entry || !entry.box) return;
                entry.box.set({ fill: hex });
            }

            function syncCalloutWidth(calloutId, width) {
                const entry = calloutRegistry[calloutId];
                if (!entry) return;
                if (entry.leg1) { entry.leg1.set({ strokeWidth: width }); entry.leg1.setCoords(); }
                if (entry.leg2) { entry.leg2.set({ strokeWidth: width }); entry.leg2.setCoords(); }
                if (entry.head) {
                    const size = arrowHeadSize(width);
                    entry.head.set({ width: size, height: size });
                    entry.head.setCoords();
                }
                // A thicker border should grow evenly on all sides of the card, same as any
                // other shape — setCoords() alone won't do that here since the frame's own
                // left/top/width/height are fully recomputed from the box anyway.
                if (entry.frame) { entry.frame.set({ strokeWidth: width }); updateCalloutGeometry(entry); }
            }

            // The visible card background lives on the frame, not the tight text box — route
            // opacity changes there so the whole card fades, not a sliver behind the text.
            function syncCalloutOpacity(calloutId, opacity) {
                const entry = calloutRegistry[calloutId];
                if (!entry || !entry.frame) return;
                const rgb = calloutFrameRgb(entry);
                entry.frame.set({ fill: `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${opacity})` });
            }

            // Pan state
            let isPanning = false;
            let lastPosX, lastPosY;

            function resizeCanvas() {
                canvas.setWidth(canvasContainer.clientWidth);
                canvas.setHeight(canvasContainer.clientHeight);
                canvas.renderAll();
            }

            window.addEventListener('resize', resizeCanvas);

            const btnFullscreen = document.getElementById('btn-fullscreen');
            const fullscreenIcon = document.getElementById('fullscreen-icon');
            
            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    // Enter fullscreen on the main container so toolbar is still visible
                    document.documentElement.requestFullscreen().catch(err => {
                        console.error(`Error attempting to enable fullscreen: ${err.message}`);
                    });
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            }

            btnFullscreen.addEventListener('click', toggleFullscreen);

            // Listen for fullscreen changes to update icon and resize canvas
            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    fullscreenIcon.classList.remove('fa-expand');
                    fullscreenIcon.classList.add('fa-compress');
                } else {
                    fullscreenIcon.classList.remove('fa-compress');
                    fullscreenIcon.classList.add('fa-expand');
                }
                
                // Allow a tiny delay for the browser layout to settle before resizing canvas
                setTimeout(resizeCanvas, 50);
            });


            // True when the swatch click should open the Text/Background popover instead of
            // the browser's native color dialog: either a text-like object is selected
            // (a callout, or a plain Textbox/IText), or nothing's selected but the next thing
            // placed will be one (Text/Callout tool armed) — so the popover also pre-sets the
            // colors a freshly-created text box or callout will start with.
            function textLikeSelection() {
                const obj = canvas.getActiveObject();
                if (obj && (obj.calloutId || obj.type === 'i-text' || obj.type === 'textbox')) return obj;
                return null;
            }
            function isTextLikeContext() {
                return !!textLikeSelection() || (!canvas.getActiveObject() && (currentMode === 'text' || currentMode === 'callout'));
            }

            document.getElementById('colorPicker').addEventListener('click', (e) => {
                if (isTextLikeContext()) {
                    e.preventDefault();
                    updateTextColorPopoverValues();
                    const rect = e.target.getBoundingClientRect();
                    textColorPopover.style.top = `${rect.bottom + 6}px`;
                    textColorPopover.style.left = `${rect.left}px`;
                    textColorPopover.classList.remove('hidden');
                }
            });

            document.getElementById('colorPicker').addEventListener('input', (e) => {
                currentColor = e.target.value;
                canvas.freeDrawingBrush.color = currentColor;

                // Update selected object(s) color — text-like objects are excluded since their
                // color now comes exclusively from the Text/Background popover above.
                const activeObjects = canvas.getActiveObjects();
                if (activeObjects.length) {
                    activeObjects.forEach(obj => {
                        if (obj.calloutId || obj.type === 'i-text' || obj.type === 'textbox') {
                            // handled by the popover instead
                        } else if (obj.type === 'group') {
                            // Arrows are a Line+Triangle group — recolor the parts, not the group itself
                            obj.getObjects().forEach(subObj => {
                                subObj.set('stroke', currentColor);
                                if (subObj.fill) subObj.set('fill', currentColor);
                            });
                        } else if (obj.type === 'path' || obj.type === 'line') {
                            obj.set('stroke', currentColor);
                            if (obj.fill) obj.set('fill', currentColor); // Update arrowheads
                        } else {
                            obj.set('stroke', currentColor);
                        }
                    });
                    canvas.renderAll();
                }
            });

            // Text/Background popover — replaces the old separate BG/Font toolbar swatches.
            // Works for a plain Textbox exactly the same way it works for a callout, so the
            // same two fields cover both instead of the callout tool needing its own controls.
            const textColorPopover = document.getElementById('textColorPopover');
            const textColorInput = document.getElementById('textColorInput');
            const textBgColorInput = document.getElementById('textBgColorInput');

            function updateTextColorPopoverValues() {
                const obj = textLikeSelection();
                if (obj && obj.calloutId) {
                    const entry = calloutRegistry[obj.calloutId];
                    if (entry) {
                        if (entry.box && typeof entry.box.fill === 'string' && /^#/.test(entry.box.fill)) {
                            textColorInput.value = entry.box.fill;
                        }
                        textBgColorInput.value = rgbToHex(calloutFrameRgb(entry));
                    }
                } else if (obj) {
                    // Plain Textbox/IText
                    if (typeof obj.fill === 'string' && /^#/.test(obj.fill)) textColorInput.value = obj.fill;
                    textBgColorInput.value = (obj.backgroundColor && /^#/.test(obj.backgroundColor)) ? obj.backgroundColor : '#ffffff';
                } else {
                    // Nothing selected yet — popover is pre-setting defaults for the next
                    // text/callout that gets placed.
                    textColorInput.value = currentColor;
                    textBgColorInput.value = currentTextBgColor || '#ffffff';
                }
            }

            textColorInput.addEventListener('input', (e) => {
                const hex = e.target.value;
                const obj = textLikeSelection();
                if (obj && obj.calloutId) {
                    syncCalloutFontColor(obj.calloutId, hex);
                } else if (obj) {
                    obj.set('fill', hex);
                } else {
                    currentColor = hex; // pre-set for the next text box placed
                }
                canvas.renderAll();
            });

            textBgColorInput.addEventListener('input', (e) => {
                const hex = e.target.value;
                const obj = textLikeSelection();
                if (obj && obj.calloutId) {
                    syncCalloutBgColor(obj.calloutId, hex);
                } else if (obj) {
                    obj.set('backgroundColor', hex);
                } else {
                    currentTextBgColor = hex; // pre-set for the next text box placed
                }
                canvas.renderAll();
            });

            document.getElementById('btn-clear-text-bg').addEventListener('click', () => {
                const obj = textLikeSelection();
                if (obj && !obj.calloutId) {
                    // Callouts always need their card background — only a plain text box's
                    // background can be cleared back to fully transparent.
                    obj.set('backgroundColor', '');
                } else if (!obj) {
                    currentTextBgColor = '';
                }
                canvas.renderAll();
            });

            document.addEventListener('mousedown', (e) => {
                if (!textColorPopover.classList.contains('hidden') &&
                    !textColorPopover.contains(e.target) && e.target.id !== 'colorPicker') {
                    textColorPopover.classList.add('hidden');
                }
            });

            const lineWidthSlider = document.getElementById('lineWidth');
            const lineWidthNumber = document.getElementById('lineWidthNumber');

            function applyLineWidth(value) {
                currentWidth = Math.min(20, Math.max(1, Math.round(value)));
                lineWidthSlider.value = currentWidth;
                lineWidthNumber.value = currentWidth;
                canvas.freeDrawingBrush.width = currentWidth;

                // Update selected object(s) line width
                const activeObjects = canvas.getActiveObjects();
                if (activeObjects.length) {
                    activeObjects.forEach(obj => {
                        if (obj.type === 'group') {
                            // Safely update arrows without scaling bounding box incorrectly
                            obj.getObjects().forEach(subObj => {
                                if (subObj.type === 'line') {
                                    subObj.set('strokeWidth', currentWidth);
                                } else if (subObj.type === 'triangle') {
                                    const size = arrowHeadSize(currentWidth);
                                    subObj.set({ width: size, height: size });
                                }
                                // The group recalculates its own bounds FROM each child's cached
                                // coords — without refreshing those first, addWithUpdate() below
                                // reads stale child geometry and the group's own selection box
                                // never resizes to match the new (thicker/bigger-headed) arrow.
                                subObj.setCoords();
                            });
                            obj.addWithUpdate();
                            obj.setCoords();
                        } else if (obj.calloutId) {
                            // Keep a callout's box border matching its arrow's thickness
                            syncCalloutWidth(obj.calloutId, currentWidth);
                        } else if (obj.type !== 'i-text' && obj.type !== 'textbox') {
                            // Rect/Circle/Path use a top-left origin, so left/top mark the
                            // UNSTROKED path corner — Fabric doesn't shift it when strokeWidth
                            // changes, which made a thicker weight look like it only grew toward
                            // the bottom-right. Shift left/top by half the delta to keep the
                            // shape's center fixed and the growth even on every side. Center-origin
                            // shapes (lines, polygons) don't need this — they're already symmetric.
                            const prevStroke = obj.strokeWidth || 0;
                            const delta = currentWidth - prevStroke;
                            const shiftX = obj.originX === 'center' ? 0 : delta / 2;
                            const shiftY = obj.originY === 'center' ? 0 : delta / 2;
                            obj.set({
                                strokeWidth: currentWidth,
                                left: obj.left - shiftX,
                                top: obj.top - shiftY
                            });
                            obj.setCoords();
                        }
                    });
                    canvas.renderAll();
                }
            }

            lineWidthSlider.addEventListener('input', (e) => applyLineWidth(e.target.value));
            lineWidthNumber.addEventListener('input', (e) => {
                if (e.target.value === '') return;
                applyLineWidth(e.target.value);
            });

            document.getElementById('fontFamily').addEventListener('change', (e) => {
                currentFont = e.target.value;
                updateSelectedText({ fontFamily: currentFont });
            });

            const fontSizeSlider = document.getElementById('fontSize');
            const fontSizeNumber = document.getElementById('fontSizeNumber');

            function applyFontSize(value) {
                currentFontSize = Math.min(72, Math.max(10, Math.round(value)));
                fontSizeSlider.value = currentFontSize;
                fontSizeNumber.value = currentFontSize;
                updateSelectedText({ fontSize: currentFontSize });
            }

            fontSizeSlider.addEventListener('input', (e) => applyFontSize(e.target.value));
            fontSizeNumber.addEventListener('input', (e) => {
                if (e.target.value === '') return;
                applyFontSize(e.target.value);
            });

            const opacitySlider = document.getElementById('opacitySlider');
            const opacityNumber = document.getElementById('opacityNumber');

            function applyOpacity(value) {
                currentOpacity = Math.min(1, Math.max(0, parseFloat(value)));
                opacitySlider.value = currentOpacity;
                opacityNumber.value = currentOpacity;
                const activeObjects = canvas.getActiveObjects();
                if (activeObjects.length) {
                    activeObjects.forEach(obj => {
                        // The visible card background is the frame behind the box, not the box
                        // itself, and it also carries the background COLOR — recompose rather
                        // than overwrite so an independently-chosen bg color survives.
                        if (obj.calloutId) {
                            syncCalloutOpacity(obj.calloutId, currentOpacity);
                        } else {
                            // Whole-object fade — images, shapes, text, the compare widget, etc.
                            obj.set('opacity', currentOpacity);
                        }
                    });
                    canvas.renderAll();
                }
            }

            opacitySlider.addEventListener('input', (e) => applyOpacity(e.target.value));
            opacityNumber.addEventListener('input', (e) => {
                if (e.target.value === '') return;
                applyOpacity(e.target.value);
            });

            function updateSelectedText(props) {
                const activeObjects = canvas.getActiveObjects();
                if (activeObjects.length) {
                    activeObjects.forEach(obj => {
                        if (obj.type === 'i-text' || obj.type === 'textbox') {
                            obj.set(props);
                            // Font size/family changes reflow the text — keep the callout's frame in sync
                            if (obj.calloutId) updateCalloutGeometry(calloutRegistry[obj.calloutId]);
                        } else if (obj.type === 'group') {
                             obj.getObjects().forEach(subObj => {
                                 if (subObj.type === 'textbox') subObj.set(props);
                             });
                             obj.addWithUpdate();
                        }
                    });
                    canvas.renderAll();
                }
            }

            // Reflect the selected object's own current styling into the toolbar controls —
            // the reverse of applyLineWidth/applyFontSize/applyOpacity/colorPicker, which push
            // the toolbar's values ONTO the selection. Without this, the sliders/inputs keep
            // showing whatever was last touched instead of what the newly-selected object
            // actually has.
            function syncToolbarFromSelection() {
                const obj = canvas.getActiveObjects()[0];
                if (!obj) return;

                const isText = obj.type === 'i-text' || obj.type === 'textbox';
                const groupLine = obj.type === 'group' ? obj.getObjects().find(o => o.type === 'line') : null;
                const groupTextbox = obj.type === 'group' ? obj.getObjects().find(o => o.type === 'textbox') : null;

                // Color: text fill, arrow's line stroke, callout's leader stroke, or plain stroke
                let color = null;
                if (isText) color = obj.fill;
                else if (groupLine) color = groupLine.stroke;
                else if (obj.calloutId) {
                    const entry = calloutRegistry[obj.calloutId];
                    if (entry && entry.leg1) color = entry.leg1.stroke;
                } else if (obj.stroke) color = obj.stroke;
                if (typeof color === 'string' && /^#/.test(color)) {
                    currentColor = color;
                    document.getElementById('colorPicker').value = color;
                }

                // Weight: callout's leader thickness, arrow's line thickness, or plain strokeWidth
                let weight = null;
                if (groupLine) weight = groupLine.strokeWidth;
                else if (obj.calloutId) {
                    const entry = calloutRegistry[obj.calloutId];
                    if (entry && entry.leg1) weight = entry.leg1.strokeWidth;
                } else if (!isText && typeof obj.strokeWidth === 'number') {
                    weight = obj.strokeWidth;
                }
                if (typeof weight === 'number') {
                    // Floor at 1 same as applyLineWidth's own clamp — a stroke thinner than that
                    // reads as invisible, and a stray 0 (e.g. from an older saved object) would
                    // otherwise show up unclamped here since this path never went through it.
                    currentWidth = Math.max(1, Math.round(weight));
                    lineWidthSlider.value = currentWidth;
                    lineWidthNumber.value = currentWidth;
                }

                // Font family/size: direct on a text object, or the textbox inside an arrow group
                const textSource = isText ? obj : groupTextbox;
                if (textSource) {
                    if (textSource.fontFamily) {
                        currentFont = textSource.fontFamily;
                        document.getElementById('fontFamily').value = textSource.fontFamily;
                    }
                    if (typeof textSource.fontSize === 'number') {
                        currentFontSize = Math.round(textSource.fontSize);
                        fontSizeSlider.value = currentFontSize;
                        fontSizeNumber.value = currentFontSize;
                    }
                }

                // Opacity: the callout card's own background lives on the frame, not the box —
                // anything else (images, shapes, text, the compare widget) just uses its own
                // whole-object opacity directly.
                if (obj.calloutId) {
                    const entry = calloutRegistry[obj.calloutId];
                    const match = entry && entry.frame && typeof entry.frame.fill === 'string'
                        ? entry.frame.fill.match(/rgba?\([^,]+,[^,]+,[^,]+,\s*([\d.]+)\)/)
                        : null;
                    if (match) {
                        currentOpacity = parseFloat(match[1]);
                        opacitySlider.value = currentOpacity;
                        opacityNumber.value = currentOpacity;
                    }
                } else if (typeof obj.opacity === 'number') {
                    currentOpacity = obj.opacity;
                    opacitySlider.value = currentOpacity;
                    opacityNumber.value = currentOpacity;
                }

            }

            canvas.on('selection:created', syncToolbarFromSelection);
            canvas.on('selection:updated', syncToolbarFromSelection);
            canvas.on('selection:cleared', () => textColorPopover.classList.add('hidden'));

            // Setup initial brush
            canvas.freeDrawingBrush.color = currentColor;
            canvas.freeDrawingBrush.width = currentWidth;

            // Save initial state
            setTimeout(saveHistory, 100);

            // Save history when objects are modified; a released callout drag also gets a
            // pass to avoid overlapping other callout notes, re-angling its arrow to match.
            canvas.on('object:modified', function(e) {
                const obj = e.target;
                if (obj && obj.calloutRole === 'box' && obj.calloutId) {
                    const entry = calloutRegistry[obj.calloutId];
                    if (entry) resolveCalloutOverlap(entry);
                }
                saveHistory();
            });
            canvas.on('path:created', function(e) {
                // Same scale-independent stroke fix as the other shapes — a freehand stroke
                // shouldn't visually thin out if the resulting path is later scaled.
                if (e.path) e.path.set('strokeUniform', true);
                saveHistory();
            });

            // Infinite Zoom (Mouse Wheel)
            canvas.on('mouse:wheel', function(opt) {
                var delta = opt.e.deltaY;
                var zoom = canvas.getZoom();
                zoom *= 0.999 ** delta;
                if (zoom > 50) zoom = 50; // Max zoom
                if (zoom < 0.01) zoom = 0.01; // Min zoom
                canvas.zoomToPoint({ x: opt.e.offsetX, y: opt.e.offsetY }, zoom);
                updateMultiSelectToolbar(); // Keep toolbar pinned
                updateImageNameLabel();
                opt.e.preventDefault();
                opt.e.stopPropagation();
            });

            const dropOverlay = document.getElementById('drop-overlay');

            // Tracked purely so Ctrl/Cmd+V paste (below) can drop the pasted image under the
            // cursor's last known position instead of always defaulting to canvas center.
            let lastMouseClientX = null, lastMouseClientY = null;
            document.addEventListener('mousemove', (e) => {
                lastMouseClientX = e.clientX;
                lastMouseClientY = e.clientY;
            });

            // Needed for some browsers (like Safari) to allow dropping correctly
            document.addEventListener('dragenter', (e) => {
                e.preventDefault();
                e.stopPropagation();
            });

            // Handle drag over the entire document
            document.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                // Check if the dragged items are files
                if (e.dataTransfer.types && e.dataTransfer.types.includes('Files')) {
                    dropOverlay.classList.remove('hidden');
                    dropOverlay.classList.add('flex');
                }
            });

            document.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                // Check relatedTarget to ensure we are actually leaving the browser window
                if (!e.relatedTarget) {
                    dropOverlay.classList.add('hidden');
                    dropOverlay.classList.remove('flex');
                }
            });

            document.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                dropOverlay.classList.add('hidden');
                dropOverlay.classList.remove('flex');

                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    // Calculate drop coordinates manually relative to the canvas container
                    // This prevents crashes caused by dropping onto the global blue overlay
                    const rect = document.getElementById('canvas-container').getBoundingClientRect();
                    const vpt = canvas.viewportTransform;
                    
                    let dropPoint = null;
                    if (e.clientX >= rect.left && e.clientX <= rect.right && 
                        e.clientY >= rect.top && e.clientY <= rect.bottom) {
                        dropPoint = {
                            x: (e.clientX - rect.left - vpt[4]) / vpt[0],
                            y: (e.clientY - rect.top - vpt[5]) / vpt[3]
                        };
                    }
                    processFiles(e.dataTransfer.files, dropPoint);
                }
            });

            // Reusable function to handle file loading (used by both input and drop)
            // Adds one image (from a data URL) onto the canvas with the standard staggered
            // drop-in animation. Shared by the direct image-file path and the PDF page-picker,
            // so a flattened PDF page behaves exactly like any other dropped image.
            // `counter` is a shared {offset, dropSequence} object mutated across a whole batch
            // so multiple images/pages added together still stagger relative to each other.
            // `options.maxW`/`options.maxH` override the default "80% of canvas" auto-fit —
            // used to shrink each image to a grid cell's size when laying out a multi-page
            // PDF import. `options.skipOffset` suppresses the usual staggered-position nudge
            // (grid placement already gives each image its own distinct spot).
            function addImageToCanvas(dataUrl, fileName, dropPointer, counter, options = {}) {
                const cWidth = canvas.getWidth();
                const cHeight = canvas.getHeight();

                const imgElement = new Image();
                imgElement.onload = function() {
                    const img = new fabric.Image(imgElement);
                    img.sourceFileName = fileName;

                    // Scale down large images initially to fit canvas nicely
                    const maxW = options.maxW || cWidth * 0.8;
                    const maxH = options.maxH || cHeight * 0.8;
                    if (img.width > maxW || img.height > maxH) {
                        img.scaleToWidth(maxW);
                        if (img.getScaledHeight() > maxH) {
                            img.scaleToHeight(maxH);
                        }
                    }

                    // Calculate target drop location. If defaulting to center,
                    // make sure it drops in the VISUAL center of current pan/zoom
                    const vpt = canvas.viewportTransform;
                    let targetX = (cWidth / 2 - vpt[4]) / vpt[0];
                    let targetY = (cHeight / 2 - vpt[5]) / vpt[3];

                    if (dropPointer && typeof dropPointer.x === 'number' && !isNaN(dropPointer.x)) {
                        targetX = dropPointer.x;
                        targetY = dropPointer.y;
                    }

                    // Apply coordinates and properties. Land it slightly small/transparent
                    // and animate up to full size/opacity — a quick, one-by-one "drop in".
                    const finalScaleX = img.scaleX;
                    const finalScaleY = img.scaleY;
                    const posOffset = options.skipOffset ? 0 : counter.offset;
                    img.set({
                        left: targetX + posOffset,
                        top: targetY + posOffset,
                        originX: 'center',
                        originY: 'center',
                        opacity: 0,
                        scaleX: finalScaleX * 0.92,
                        scaleY: finalScaleY * 0.92
                    });

                    if (!options.skipOffset) counter.offset += 30; // Shift the next image by 30px so it's visible

                    canvas.add(img);

                    // Keep image below annotations, but above older images
                    const objects = canvas.getObjects();
                    let lowestAnnotationIndex = -1;
                    for (let i = 0; i < objects.length - 1; i++) {
                        if (objects[i].type !== 'image') {
                            lowestAnnotationIndex = i;
                            break;
                        }
                    }

                    if (lowestAnnotationIndex !== -1) {
                        img.moveTo(lowestAnnotationIndex);
                    }

                    canvas.setActiveObject(img);

                    const dropDelay = (counter.dropSequence++) * 55;
                    setTimeout(() => {
                        const render = () => canvas.requestRenderAll();
                        img.animate('opacity', 1, { duration: 160, easing: fabric.util.ease.easeOutQuad, onChange: render });
                        img.animate('scaleX', finalScaleX, { duration: 160, easing: fabric.util.ease.easeOutQuad, onChange: render });
                        img.animate('scaleY', finalScaleY, { duration: 160, easing: fabric.util.ease.easeOutQuad, onChange: render, onComplete: () => saveHistory() });
                    }, dropDelay);
                };

                // Set source AFTER defining onload to prevent caching race conditions
                imgElement.src = dataUrl;
            }

            // Reusable function to handle file loading (used by both input and drop)
            function processFiles(files, dropPointer = null) {
                // Shared across the whole batch so multiple images/PDF pages still stagger
                // relative to one another instead of each resetting to offset 0.
                const counter = { offset: 0, dropSequence: 0 };

                Array.from(files).forEach(file => {
                    const isPdf = file.type === 'application/pdf' || file.name.match(/\.pdf$/i);
                    if (isPdf) {
                        queuePdfForPagePicker(file, dropPointer, counter);
                        return;
                    }

                    // Safety check that works even if OS hides MIME type during drag-and-drop
                    const isImage = (file.type && file.type.startsWith('image/')) || file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i);
                    if (!isImage) return;

                    const reader = new FileReader();
                    reader.onload = function(event) {
                        addImageToCanvas(event.target.result, file.name, dropPointer, counter);
                    };
                    reader.readAsDataURL(file);
                });
                setMode('select', 'btn-select');
            }

            // --- PDF import: pick pages, flatten each selected page to a PNG, then drop it
            // onto the canvas through the same addImageToCanvas() path as any other image. ---

            // Width (in px) each PDF page is flattened to before it's dropped on the canvas.
            // Higher = crisper when zoomed in, at the cost of a bigger canvas object/PNG.
            const PDF_FLATTEN_TARGET_WIDTH = 3000;

            const pdfPageModal = document.getElementById('pdf-page-modal');
            const pdfPageGrid = document.getElementById('pdf-page-grid');
            const pdfModalFilename = document.getElementById('pdf-modal-filename');
            const pdfSelectCount = document.getElementById('pdf-select-count');
            const pdfModalAddBtn = document.getElementById('pdf-modal-add');

            const pdfImportQueue = [];
            let activePdfImport = null; // { file, dropPointer, counter, pdfDoc, selectedPages: Set }

            function queuePdfForPagePicker(file, dropPointer, counter) {
                pdfImportQueue.push({ file, dropPointer, counter });
                if (!activePdfImport) processNextPdfInQueue();
            }

            async function processNextPdfInQueue() {
                const next = pdfImportQueue.shift();
                if (!next) { activePdfImport = null; return; }

                let pdfDoc;
                try {
                    const arrayBuffer = await next.file.arrayBuffer();
                    pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                } catch (err) {
                    console.error('Failed to open PDF', err);
                    processNextPdfInQueue();
                    return;
                }

                activePdfImport = {
                    file: next.file,
                    dropPointer: next.dropPointer,
                    counter: next.counter,
                    pdfDoc,
                    selectedPages: new Set() // Deselected by default — user picks which pages to import
                };

                await openPdfPagePicker();
            }

            async function renderPdfPageToDataUrl(page, targetWidth) {
                const baseViewport = page.getViewport({ scale: 1 });
                const scale = targetWidth / baseViewport.width;
                const viewport = page.getViewport({ scale });

                const pageCanvas = document.createElement('canvas');
                pageCanvas.width = Math.ceil(viewport.width);
                pageCanvas.height = Math.ceil(viewport.height);
                const ctx = pageCanvas.getContext('2d');
                await page.render({ canvasContext: ctx, viewport }).promise;
                return pageCanvas.toDataURL('image/png');
            }

            function updatePdfSelectCount() {
                const count = activePdfImport.selectedPages.size;
                pdfSelectCount.textContent = count;
                pdfModalAddBtn.disabled = count === 0;
            }

            // Keeps a grid cell's border/checkmark in sync with its selection state, and
            // updates the shared selectedPages set — the single source of truth used by both
            // individual-cell clicks and the select-all/select-none buttons.
            function setPdfPageCellSelected(cell, pageNum, selected) {
                const badge = cell.querySelector('.pdf-check-badge');
                if (selected) {
                    activePdfImport.selectedPages.add(pageNum);
                    cell.classList.add('border-blue-500');
                    cell.classList.remove('border-transparent');
                    badge.classList.remove('hidden');
                    badge.classList.add('flex');
                } else {
                    activePdfImport.selectedPages.delete(pageNum);
                    cell.classList.remove('border-blue-500');
                    cell.classList.add('border-transparent');
                    badge.classList.add('hidden');
                    badge.classList.remove('flex');
                }
                updatePdfSelectCount();
            }

            async function openPdfPagePicker() {
                const { file, pdfDoc, selectedPages } = activePdfImport;
                pdfModalFilename.textContent = `— ${file.name}`;
                pdfPageGrid.innerHTML = '';
                pdfPageModal.classList.remove('hidden');
                pdfPageModal.classList.add('flex');
                updatePdfSelectCount();

                for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                    const cell = document.createElement('button');
                    cell.type = 'button';
                    cell.className = 'group relative rounded-lg border-2 border-transparent bg-gray-900 overflow-hidden transition-colors text-left';
                    cell.innerHTML = `
                        <div class="aspect-[3/4] flex items-center justify-center bg-gray-800">
                            <i class="fa-solid fa-spinner fa-spin text-gray-600"></i>
                        </div>
                        <div class="absolute top-1.5 left-1.5 min-w-[20px] h-5 px-1.5 rounded-full bg-gray-950/90 border border-white/20 flex items-center justify-center text-[10px] font-semibold text-gray-200 pointer-events-none">${pageNum}</div>
                        <div class="pdf-check-badge hidden absolute top-1.5 right-1.5 w-5 h-5 rounded-full bg-blue-600 border border-white/30 items-center justify-center">
                            <i class="fa-solid fa-check text-[10px] text-white"></i>
                        </div>
                        <div class="px-2 py-1 text-[11px] text-gray-300 font-medium">Page ${pageNum}</div>
                    `;
                    pdfPageGrid.appendChild(cell);

                    cell.addEventListener('click', () => {
                        setPdfPageCellSelected(cell, pageNum, !selectedPages.has(pageNum));
                    });

                    // Render the thumbnail after wiring the click handler so slow renders don't
                    // block the page from being selectable.
                    pdfDoc.getPage(pageNum).then(page => renderPdfPageToDataUrl(page, 300)).then(dataUrl => {
                        const thumbWrap = cell.querySelector('.aspect-\\[3\\/4\\]');
                        thumbWrap.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-contain" draggable="false">`;
                    }).catch(err => console.error('Failed to render PDF page thumbnail', err));
                }
            }

            function closePdfPagePicker() {
                pdfPageModal.classList.add('hidden');
                pdfPageModal.classList.remove('flex');
                activePdfImport = null;
                processNextPdfInQueue();
            }

            document.getElementById('pdf-modal-close').addEventListener('click', closePdfPagePicker);
            document.getElementById('pdf-modal-cancel').addEventListener('click', closePdfPagePicker);

            document.getElementById('pdf-select-all').addEventListener('click', () => {
                if (!activePdfImport) return;
                pdfPageGrid.querySelectorAll(':scope > button').forEach((cell, i) => {
                    setPdfPageCellSelected(cell, i + 1, true);
                });
            });

            document.getElementById('pdf-select-none').addEventListener('click', () => {
                if (!activePdfImport) return;
                pdfPageGrid.querySelectorAll(':scope > button').forEach((cell, i) => {
                    setPdfPageCellSelected(cell, i + 1, false);
                });
            });

            pdfModalAddBtn.addEventListener('click', async () => {
                const { file, pdfDoc, selectedPages, dropPointer, counter } = activePdfImport;
                const pages = Array.from(selectedPages).sort((a, b) => a - b);
                pdfModalAddBtn.disabled = true;
                closePdfPagePicker();

                // A single page just drops in at the default centered/auto-fit spot, same as
                // any other image. Multiple pages are laid out on a grid, in page order, so a
                // multi-page PDF reads as an ordered set instead of a pile of overlapping pages.
                const useGrid = pages.length > 1;
                let gridCols, gridRows, cellW, cellH, gridLeft, gridTop;
                if (useGrid) {
                    const cWidth = canvas.getWidth();
                    const cHeight = canvas.getHeight();
                    const vpt = canvas.viewportTransform;
                    let centerX = (cWidth / 2 - vpt[4]) / vpt[0];
                    let centerY = (cHeight / 2 - vpt[5]) / vpt[3];
                    if (dropPointer && typeof dropPointer.x === 'number' && !isNaN(dropPointer.x)) {
                        centerX = dropPointer.x;
                        centerY = dropPointer.y;
                    }

                    gridCols = Math.ceil(Math.sqrt(pages.length));
                    gridRows = Math.ceil(pages.length / gridCols);

                    const availW = (cWidth / vpt[0]) * 0.85;
                    const availH = (cHeight / vpt[3]) * 0.85;
                    cellW = availW / gridCols;
                    cellH = availH / gridRows;
                    gridLeft = centerX - availW / 2;
                    gridTop = centerY - availH / 2;
                }

                for (let i = 0; i < pages.length; i++) {
                    const pageNum = pages[i];
                    try {
                        const page = await pdfDoc.getPage(pageNum);
                        const dataUrl = await renderPdfPageToDataUrl(page, PDF_FLATTEN_TARGET_WIDTH);
                        const pageLabel = pdfDoc.numPages > 1 ? `${file.name} — Page ${pageNum}` : file.name;

                        if (useGrid) {
                            const row = Math.floor(i / gridCols);
                            const col = i % gridCols;
                            const cellCenter = {
                                x: gridLeft + cellW * (col + 0.5),
                                y: gridTop + cellH * (row + 0.5)
                            };
                            // 10% gutter inside each cell so neighboring pages don't touch
                            addImageToCanvas(dataUrl, pageLabel, cellCenter, counter, {
                                maxW: cellW * 0.9,
                                maxH: cellH * 0.9,
                                skipOffset: true
                            });
                        } else {
                            addImageToCanvas(dataUrl, pageLabel, dropPointer, counter);
                        }
                    } catch (err) {
                        console.error('Failed to flatten PDF page', err);
                    }
                }
                setMode('select', 'btn-select');
            });

            const toolBtns = document.querySelectorAll('.toolbar-btn');
            
            function setMode(mode, btnId) {
                if (currentMode === mode) return;

                if (currentMode === 'polygon') {
                    finishPolygon(true); // Complete or cancel drawing if switching tools
                }

                // Clean up an in-progress callout drag if switching away
                if (currentMode === 'callout' && isDrawingCallout) {
                    canvas.remove(calloutLine, calloutHead);
                    isDrawingCallout = false;
                    calloutLine = null; calloutHead = null;
                }
                
                // Clean up incomplete arrow if switching away
                if (currentMode === 'arrow' && isDrawingArrow) {
                    canvas.remove(arrowLine, arrowHead);
                    isDrawingArrow = false;
                }

                currentMode = mode;
                
                // Update UI Buttons
                toolBtns.forEach(btn => btn.classList.remove('active'));
                if (btnId) document.getElementById(btnId).classList.add('active');

                // Reset canvas states
                canvas.isDrawingMode = (mode === 'draw');
                
                if (mode === 'select') {
                    // Enable object selection and interaction
                    canvas.defaultCursor = 'default';
                    canvas.selection = true;
                    applySelectableInteractivity();
                } else {
                    // Disable selection while using any specific drawing/dropping tool
                    canvas.defaultCursor = 'crosshair';
                    canvas.selection = false;
                    canvas.forEachObject(o => {
                        o.selectable = false;
                        o.evented = false;
                    });
                    canvas.discardActiveObject().requestRenderAll();
                }
            }

            function applySelectableInteractivity() {
                canvas.forEachObject(o => {
                    if (o.calloutRole === 'leg1' || o.calloutRole === 'leg2') {
                        // Clickable (grabbing the leader moves the whole callout) but never
                        // independently fabric-selectable — that was letting the leader legs
                        // get dragged off on their own. No "move" cursor here — that affordance
                        // is reserved for the arrowhead tip below.
                        o.selectable = false;
                        o.evented = true;
                        o.hoverCursor = 'default';
                        return;
                    }
                    if (o.calloutRole === 'head') {
                        // The tip — the one place a "move" cursor should appear, since this
                        // is what repositions where the arrow is pointing.
                        o.selectable = false;
                        o.evented = true;
                        o.hoverCursor = 'move';
                        return;
                    }
                    if (o.calloutRole === 'frame') {
                        // Visible card background/border behind the box — never fabric-selectable
                        // on its own, but evented so clicks/drags on the padded margin (which
                        // looks like part of the card) still grab the box, not fall through.
                        o.selectable = false;
                        o.evented = true;
                        return;
                    }
                    o.selectable = true;
                    o.evented = true;
                });
            }

            document.getElementById('btn-select').addEventListener('click', () => setMode('select', 'btn-select'));
            document.getElementById('btn-draw').addEventListener('click', () => setMode('draw', 'btn-draw'));
            document.getElementById('btn-arrow').addEventListener('click', () => setMode('arrow', 'btn-arrow'));
            document.getElementById('btn-rect').addEventListener('click', () => setMode('rect', 'btn-rect'));
            document.getElementById('btn-circle').addEventListener('click', () => setMode('circle', 'btn-circle'));
            document.getElementById('btn-poly').addEventListener('click', () => setMode('polygon', 'btn-poly'));
            document.getElementById('btn-text').addEventListener('click', () => setMode('text', 'btn-text'));
            document.getElementById('btn-callout').addEventListener('click', () => setMode('callout', 'btn-callout'));

            function finishPolygon(skipModeChange = false) {
                if (polyPoints.length < 3) {
                    // Cancel if not enough points to make a shape
                    clearPolygonDraft();
                    if (!skipModeChange) setMode('select', 'btn-select');
                    return;
                }
                
                if (activePolyLine) {
                    canvas.remove(activePolyLine);
                    activePolyLine = null;
                }
                
                // Clone points before clearing the draft lines to prevent disappearing
                const finalPoints = [...polyPoints];
                
                // Remove visual guides
                clearPolygonDraft();
                
                // To keep the final shape perfectly where it was drawn without Fabric's 
                // default offset behavior, we calculate the exact bounding box and center.
                const minX = Math.min(...finalPoints.map(p => p.x));
                const minY = Math.min(...finalPoints.map(p => p.y));
                const maxX = Math.max(...finalPoints.map(p => p.x));
                const maxY = Math.max(...finalPoints.map(p => p.y));
                
                // Map canvas coordinates to relative shape coordinates
                const relativePoints = finalPoints.map(p => ({
                    x: p.x - minX - (maxX - minX) / 2,
                    y: p.y - minY - (maxY - minY) / 2
                }));
                
                // Generate the final polygon shape exactly in place
                const poly = new fabric.Polygon(relativePoints, {
                    left: minX + (maxX - minX) / 2,
                    top: minY + (maxY - minY) / 2,
                    originX: 'center',
                    originY: 'center',
                    fill: 'transparent',
                    stroke: currentColor,
                    strokeWidth: currentWidth,
                    strokeUniform: true, // see Rect above — keeps stroke weight scale-independent
                    strokeLineJoin: 'round',
                    strokeLineCap: 'round',
                    cornerColor: '#3b82f6', borderColor: '#3b82f6', transparentCorners: false
                });

                canvas.add(poly);
                canvas.setActiveObject(poly);
                saveHistory();
                if (!skipModeChange) setMode('select', 'btn-select');
            }

            // Escape ends the line where the mouse currently is, as an open polyline —
            // it does NOT close the shape back to the first point like finishPolygon() does.
            function finishPolygonOpen() {
                if (activePolyLine) {
                    polyPoints.push({ x: activePolyLine.x2, y: activePolyLine.y2 });
                }

                if (polyPoints.length < 2) {
                    clearPolygonDraft();
                    setMode('select', 'btn-select');
                    return;
                }

                const finalPoints = [...polyPoints];
                clearPolygonDraft();

                const minX = Math.min(...finalPoints.map(p => p.x));
                const minY = Math.min(...finalPoints.map(p => p.y));
                const maxX = Math.max(...finalPoints.map(p => p.x));
                const maxY = Math.max(...finalPoints.map(p => p.y));

                const relativePoints = finalPoints.map(p => ({
                    x: p.x - minX - (maxX - minX) / 2,
                    y: p.y - minY - (maxY - minY) / 2
                }));

                const line = new fabric.Polyline(relativePoints, {
                    left: minX + (maxX - minX) / 2,
                    top: minY + (maxY - minY) / 2,
                    originX: 'center',
                    originY: 'center',
                    fill: 'transparent',
                    stroke: currentColor,
                    strokeWidth: currentWidth,
                    strokeUniform: true, // see Rect above — keeps stroke weight scale-independent
                    strokeLineJoin: 'round',
                    strokeLineCap: 'round'
                });

                canvas.add(line);
                canvas.setActiveObject(line);
                saveHistory();
                setMode('select', 'btn-select');
            }

            function clearPolygonDraft() {
