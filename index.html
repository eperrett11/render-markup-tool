                polyLines.forEach(l => canvas.remove(l));
                if (activePolyLine) {
                    canvas.remove(activePolyLine);
                    activePolyLine = null;
                }
                polyLines = [];
                polyPoints = [];
            }

            canvas.on('mouse:down', function(o) {
                const evt = o.e;
                
                // Handle Panning (Middle click or Alt+Drag)
                if (evt.altKey === true || evt.button === 1 || evt.button === 2) {
                    evt.preventDefault(); // Stop browser auto-scroll behaviors
                    isPanning = true;
                    canvas.selection = false;
                    lastPosX = evt.clientX;
                    lastPosY = evt.clientY;
                    return;
                }

                // Mid "pick a partner" flow (Compare clicked with one image selected): a click
                // on a DIFFERENT image completes the pair; anything else — the same image again,
                // empty canvas, some other object — just cancels picking rather than also acting
                // on that click, so the gesture stays predictable.
                if (isPickingCompareTarget) {
                    const clickedImage = o.target && o.target.type === 'image' ? o.target : null;
                    const source = comparePickSource;
                    cancelComparePicking();
                    if (clickedImage && clickedImage !== source) {
                        createCompareWidget(source, clickedImage);
                    }
                    return;
                }

                // While actively typing in a callout/text box, a click inside it is placing the
                // text cursor or extending a selection — let Fabric handle that natively instead
                // of treating it as a canvas click (which, in callout mode, would otherwise plant
                // a brand new callout right under the cursor).
                const activeObj = canvas.getActiveObject();
                if (activeObj && activeObj.isEditing && o.target === activeObj) {
                    return;
                }

                // Snapshot sticky/anchor data here, before the image has moved at all — see
                // computeStickyData()'s comment for why this can't wait for the first drag tick.
                if (o.target && o.target.type === 'image') {
                    computeStickyData(o.target);
                }

                const pointer = canvas.getPointer(o.e);

                // A click landing on any CompareSlider's divider handle — selected or not —
                // drags the divider instead of moving/selecting the widget. Checked against
                // every compareSlider on the canvas (not just o.target) since the handle can
                // extend slightly beyond the object's own bounding box at the drag hit-test
                // margin. Fabric already committed its own default transform for this mousedown
                // by the time this fires (see hitTestCompareHandle's comment) — null it out so
                // the object doesn't also start sliding/moving underneath our own drag.
                if (currentMode === 'select') {
                    const compareTarget = canvas.getObjects().find(o2 => hitTestCompareHandle(o2, pointer));
                    if (compareTarget) {
                        isDraggingCompareHandle = true;
                        compareDragTarget = compareTarget;
                        canvas._currentTransform = null;
                        canvas.selection = false;
                        canvas.requestRenderAll();
                        return;
                    }
                }

                // Grabbing a callout's leader line moves the WHOLE callout (box, frame, leader,
                // arrowhead) rigidly together — and a plain click (no drag) leaves the box
                // selected, so Delete removes everything. Grabbing the arrowhead instead repositions
                // just the tip, leaving the box in place. Both are hand-rolled drags (not fabric's
                // own object transform) since these parts are deliberately non-selectable.
                if (currentMode === 'select' && o.target) {
                    if (o.target.calloutRole === 'leg1' || o.target.calloutRole === 'leg2') {
                        const entry = calloutRegistry[o.target.calloutId];
                        if (entry) {
                            isDraggingCalloutRigid = true;
                            rigidDragEntry = entry;
                            rigidDragStart = { x: pointer.x, y: pointer.y };
                            rigidDragOriginal = {
                                tipX: entry.leg1.tipX, tipY: entry.leg1.tipY,
                                leg1X2: entry.leg1.x2, leg1Y2: entry.leg1.y2,
                                leg2X1: entry.leg2.x1, leg2Y1: entry.leg2.y1,
                                leg2X2: entry.leg2.x2, leg2Y2: entry.leg2.y2,
                                headX: entry.head.left, headY: entry.head.top,
                                frameX: entry.frame.left, frameY: entry.frame.top,
                                boxX: entry.box.left, boxY: entry.box.top
                            };
                            canvas.discardActiveObject();
                            canvas.selection = false;
                            canvas.requestRenderAll();
                            return;
                        }
                    } else if (o.target.calloutRole === 'head') {
                        const entry = calloutRegistry[o.target.calloutId];
                        if (entry) {
                            isDraggingCalloutTip = true;
                            tipDragEntry = entry;
                            canvas.discardActiveObject();
                            canvas.selection = false;
                            canvas.requestRenderAll();
                            return;
                        }
                    } else if (o.target.calloutRole === 'frame') {
                        const entry = calloutRegistry[o.target.calloutId];
                        if (entry) {
                            isDraggingCalloutFrame = true;
                            frameDragEntry = entry;
                            frameDragStart = { x: pointer.x, y: pointer.y };
                            frameDragOriginalBox = { x: entry.box.left, y: entry.box.top };
                            canvas.discardActiveObject();
                            canvas.selection = false;
                            canvas.requestRenderAll();
                            return;
                        }
                    }
                }

                if (currentMode === 'rect') {
                    isDrawingShape = true;
                    shapeStart = { x: pointer.x, y: pointer.y };
                    activeShape = new fabric.Rect({
                        left: pointer.x, top: pointer.y, originX: 'left', originY: 'top',
                        width: 0, height: 0, fill: 'transparent',
                        stroke: currentColor, strokeWidth: currentWidth,
                        // Keeps the stroke's on-screen thickness constant regardless of the
                        // shape's own scaleX/scaleY — without this, resizing via a corner handle
                        // (which changes scale, not width/height) visually thins/thickens the
                        // border, so the same "weight" value looks different across objects that
                        // happen to have been resized by different amounts.
                        strokeUniform: true,
                        cornerColor: '#3b82f6', borderColor: '#3b82f6', transparentCorners: false
                    });
                    canvas.add(activeShape);
                } else if (currentMode === 'circle') {
                    isDrawingShape = true;
                    shapeStart = { x: pointer.x, y: pointer.y };
                    activeShape = new fabric.Circle({
                        left: pointer.x, top: pointer.y, originX: 'left', originY: 'top',
                        radius: 0, fill: 'transparent',
                        stroke: currentColor, strokeWidth: currentWidth,
                        strokeUniform: true, // see Rect above — keeps stroke weight scale-independent
                        cornerColor: '#3b82f6', borderColor: '#3b82f6', transparentCorners: false
                    });
                    canvas.add(activeShape);
                } else if (currentMode === 'text') {
                    // Textbox (not IText) so the side handles can drag the wrap width, same as callouts
                    const text = new fabric.Textbox('Type here...', {
                        left: pointer.x, top: pointer.y, originX: 'center', originY: 'center',
                        width: 200, fontFamily: currentFont, fill: currentColor, fontSize: currentFontSize,
                        backgroundColor: currentTextBgColor,
                        cornerColor: '#3b82f6', borderColor: '#3b82f6', transparentCorners: false
                    });
                    canvas.add(text);
                    canvas.setActiveObject(text);
                    text.enterEditing();
                    text.selectAll();
                    saveHistory();
                    setMode('select', 'btn-select');
                } else if (currentMode === 'callout') {
                    // Click-drag-release: mouse down plants the fixed tip, drag previews the
                    // arrow, release drops the note box wherever the mouse is.
                    // Callouts default to white (independent of the shared color picker) since
                    // they're meant to read as a clean note against any photo — pick the callout
                    // back up and use the color picker to customize it like any other object.
                    isDrawingCallout = true;
                    calloutLine = new fabric.Line([pointer.x, pointer.y, pointer.x, pointer.y], {
                        strokeWidth: currentWidth, fill: CALLOUT_DEFAULT_COLOR, stroke: CALLOUT_DEFAULT_COLOR,
                        originX: 'center', originY: 'center', selectable: false, evented: false,
                        tipX: pointer.x, tipY: pointer.y // fixed anchor, read via tipX/tipY (see calloutRegistry note)
                    });
                    calloutHead = new fabric.Triangle({
                        width: arrowHeadSize(currentWidth), height: arrowHeadSize(currentWidth), fill: CALLOUT_DEFAULT_COLOR,
                        left: pointer.x, top: pointer.y, originX: 'center', originY: 'center',
                        selectable: false, evented: false, angle: 90
                    });
                    canvas.add(calloutLine, calloutHead);
                } else if (currentMode === 'arrow') {
                    isDrawingArrow = true;
                    arrowLine = new fabric.Line([pointer.x, pointer.y, pointer.x, pointer.y], {
                        strokeWidth: currentWidth, fill: currentColor, stroke: currentColor,
                        strokeUniform: true, // see Rect above — keeps stroke weight scale-independent
                        originX: 'center', originY: 'center', selectable: false, evented: false
                    });
                    arrowHead = new fabric.Triangle({
                        width: arrowHeadSize(currentWidth), height: arrowHeadSize(currentWidth), fill: currentColor,
                        left: pointer.x, top: pointer.y, originX: 'center', originY: 'center',
                        selectable: false, evented: false, angle: 90
                    });
                    canvas.add(arrowLine, arrowHead);
                } else if (currentMode === 'polygon') {
                    // Check if we are clicking near the first point to auto-close
                    if (polyPoints.length > 2) {
                        const first = polyPoints[0];
                        const dist = Math.sqrt(Math.pow(pointer.x - first.x, 2) + Math.pow(pointer.y - first.y, 2));
                        if (dist < 20) {
                            finishPolygon();
                            return;
                        }
                    }

                    polyPoints.push({ x: pointer.x, y: pointer.y });
                    
                    if (polyPoints.length > 1) {
                        const prev = polyPoints[polyPoints.length - 2];
                        const line = new fabric.Line([prev.x, prev.y, pointer.x, pointer.y], {
                            strokeWidth: currentWidth, fill: currentColor, stroke: currentColor,
                            originX: 'center', originY: 'center', selectable: false, evented: false,
                            strokeLineCap: 'round', strokeLineJoin: 'round'
                        });
                        polyLines.push(line);
                        canvas.add(line);
                    }
                    
                    if (activePolyLine) canvas.remove(activePolyLine);
                    activePolyLine = new fabric.Line([pointer.x, pointer.y, pointer.x, pointer.y], {
                        strokeWidth: currentWidth, fill: currentColor, stroke: currentColor,
                        originX: 'center', originY: 'center', selectable: false, evented: false,
                        strokeLineCap: 'round', strokeLineJoin: 'round'
                    });
                    canvas.add(activePolyLine);
                }
            });

            canvas.on('mouse:move', function(o) {
                if (isPanning) {
                    const e = o.e;
                    const vpt = canvas.viewportTransform;
                    vpt[4] += e.clientX - lastPosX;
                    vpt[5] += e.clientY - lastPosY;
                    canvas.requestRenderAll();
                    updateMultiSelectToolbar(); // Keep toolbar pinned to moving DOM
                    updateImageNameLabel();
                    lastPosX = e.clientX;
                    lastPosY = e.clientY;
                    return;
                }

                const pointer = canvas.getPointer(o.e);

                if (isDraggingCompareHandle && compareDragTarget) {
                    // toLocalPoint rotates+translates into the object's local axes but does NOT
                    // divide out scale, so it ranges over ±(width*scaleX)/2 — same convention
                    // the object's own dividerHandle actionHandler uses (see that comment).
                    const target = compareDragTarget;
                    const localPoint = target.toLocalPoint(new fabric.Point(pointer.x, pointer.y), 'center', 'center');
                    const scaledWidth = target.width * (target.scaleX || 1);
                    let frac = scaledWidth ? (localPoint.x / scaledWidth + 0.5) : 0.5;
                    frac = Math.max(0.015, Math.min(0.985, frac));
                    if (target.divider !== frac) {
                        target.set('divider', frac);
                        canvas.requestRenderAll();
                    }
                    return;
                }

                if (isDraggingCalloutRigid && rigidDragEntry) {
                    const dx = pointer.x - rigidDragStart.x;
                    const dy = pointer.y - rigidDragStart.y;
                    const e = rigidDragEntry, orig = rigidDragOriginal;
                    e.leg1.set({
                        x1: orig.tipX + dx, y1: orig.tipY + dy,
                        x2: orig.leg1X2 + dx, y2: orig.leg1Y2 + dy,
                        tipX: orig.tipX + dx, tipY: orig.tipY + dy
                    });
                    e.leg1.setCoords();
                    e.leg2.set({
                        x1: orig.leg2X1 + dx, y1: orig.leg2Y1 + dy,
                        x2: orig.leg2X2 + dx, y2: orig.leg2Y2 + dy
                    });
                    e.leg2.setCoords();
                    e.head.set({ left: orig.headX + dx, top: orig.headY + dy });
                    e.head.setCoords();
                    e.frame.set({ left: orig.frameX + dx, top: orig.frameY + dy });
                    e.frame.setCoords();
                    e.box.set({ left: orig.boxX + dx, top: orig.boxY + dy });
                    e.box.setCoords();
                    canvas.requestRenderAll();
                    return;
                }

                if (isDraggingCalloutTip && tipDragEntry) {
                    tipDragEntry.leg1.tipX = pointer.x;
                    tipDragEntry.leg1.tipY = pointer.y;
                    updateCalloutGeometry(tipDragEntry);
                    canvas.requestRenderAll();
                    return;
                }

                if (isDraggingCalloutFrame && frameDragEntry) {
                    const dx = pointer.x - frameDragStart.x;
                    const dy = pointer.y - frameDragStart.y;
                    frameDragEntry.box.set({
                        left: frameDragOriginalBox.x + dx,
                        top: frameDragOriginalBox.y + dy
                    });
                    frameDragEntry.box.setCoords();
                    updateCalloutGeometry(frameDragEntry);
                    canvas.requestRenderAll();
                    return;
                }

                if (isDrawingShape && activeShape) {
                    if (currentMode === 'rect') {
                        activeShape.set({
                            width: Math.abs(pointer.x - shapeStart.x),
                            height: Math.abs(pointer.y - shapeStart.y),
                            left: Math.min(pointer.x, shapeStart.x),
                            top: Math.min(pointer.y, shapeStart.y)
                        });
                    } else if (currentMode === 'circle') {
                        const radius = Math.max(Math.abs(pointer.x - shapeStart.x), Math.abs(pointer.y - shapeStart.y)) / 2;
                        activeShape.set({
                            radius: radius,
                            left: Math.min(pointer.x, shapeStart.x),
                            top: Math.min(pointer.y, shapeStart.y)
                        });
                    }
                    canvas.renderAll();
                } else if (currentMode === 'arrow' && isDrawingArrow && arrowLine && arrowHead) {
                    // Update line end
                    arrowLine.set({ x2: pointer.x, y2: pointer.y });
                    
                    // Update arrowhead position
                    arrowHead.set({ left: pointer.x, top: pointer.y });
                    
                    // Calculate rotation angle for arrowhead
                    const dx = pointer.x - arrowLine.x1;
                    const dy = pointer.y - arrowLine.y1;
                    let angle = Math.atan2(dy, dx) * 180 / Math.PI;
                    arrowHead.set({ angle: angle + 90 });
                    
                    canvas.renderAll();
                } else if (currentMode === 'callout' && isDrawingCallout && calloutLine && calloutHead) {
                    // Keep arrow tip (x1, y1) anchored. Draw line TO pointer (x2, y2)
                    calloutLine.set({ x2: pointer.x, y2: pointer.y });

                    // Rotate arrowhead at the tip to face AWAY from pointer towards tip
                    const dx = calloutLine.tipX - pointer.x;
                    const dy = calloutLine.tipY - pointer.y;
                    let angle = Math.atan2(dy, dx) * 180 / Math.PI;
                    calloutHead.set({ angle: angle + 90 });

                    canvas.renderAll();
                } else if (currentMode === 'polygon' && activePolyLine) {
                    // Update end point of the active polygon line to follow cursor
                    activePolyLine.set({ x2: pointer.x, y2: pointer.y });
                    canvas.renderAll();
                }
            });

            canvas.on('mouse:up', function(o) {
                clearGuidelines();
                isDraggingSticky = false;
                
                if (isPanning) {
                    canvas.setViewportTransform(canvas.viewportTransform);
                    isPanning = false;
                    if (currentMode === 'select') canvas.selection = true;
                    return;
                }

                if (isDraggingCompareHandle) {
                    isDraggingCompareHandle = false;
                    canvas.selection = true;
                    compareDragTarget = null;
                    saveHistory();
                    return;
                }

                if (isDraggingCalloutRigid) {
                    isDraggingCalloutRigid = false;
                    canvas.selection = true;
                    if (rigidDragEntry) canvas.setActiveObject(rigidDragEntry.box);
                    rigidDragEntry = null; rigidDragStart = null; rigidDragOriginal = null;
                    saveHistory();
                    return;
                }

                if (isDraggingCalloutTip) {
                    isDraggingCalloutTip = false;
                    canvas.selection = true;
                    tipDragEntry = null;
                    saveHistory();
                    return;
                }

                if (isDraggingCalloutFrame) {
                    isDraggingCalloutFrame = false;
                    canvas.selection = true;
                    if (frameDragEntry) canvas.setActiveObject(frameDragEntry.box);
                    frameDragEntry = null; frameDragStart = null; frameDragOriginalBox = null;
                    saveHistory();
                    return;
                }

                if (isDrawingShape) {
                    isDrawingShape = false;
                    if (activeShape) {
                        activeShape.setCoords();
                        // If it's too small (accidental click), remove it
                        if ((currentMode === 'rect' && activeShape.width < 5) || 
                            (currentMode === 'circle' && activeShape.radius < 5)) {
                            canvas.remove(activeShape);
                        } else {
                            canvas.setActiveObject(activeShape);
                            saveHistory();
                        }
                    }
                    activeShape = null;
                    setMode('select', 'btn-select');
                }

                if (currentMode === 'callout' && isDrawingCallout) {
                    isDrawingCallout = false;

                    if (calloutLine) {
                        let dropX = calloutLine.x2;
                        let dropY = calloutLine.y2;
                        const tipX = calloutLine.tipX, tipY = calloutLine.tipY;

                        // A real click-drag always drops the box exactly where you dragged it —
                        // no override. Only a plain click (no real drag) gets the "smart"
                        // placement below, since otherwise there'd be nothing for the user to
                        // drag the box away from in the first place.
                        let clickedImage = null;
                        let creationSide = null;
                        const dist = Math.hypot(dropX - tipX, dropY - tipY);
                        if (dist < 10) {
                            // Plain axis-aligned bounds check (not containsPoint) — matches how
                            // computeOffImagePosition and the sticky-drag anchor logic already
                            // treat images elsewhere, so a click can't be judged "on the image"
                            // by one rule and "off the image" by another.
                            clickedImage = canvas.getObjects().slice().reverse()
                                .find(o => o.type === 'image' && pointInRect(tipX, tipY, o.getBoundingRect(true)));
                            if (clickedImage) {
                                const placed = computeOffImagePosition(clickedImage.getBoundingRect(true), tipX, tipY);
                                dropX = placed.dropX;
                                dropY = placed.dropY;
                                creationSide = placed.side;
                            } else {
                                // No image under the tip — nudge aside so a plain click doesn't
                                // drop the note directly on top of the tip.
                                dropX = tipX + 70;
                                dropY = tipY;
                            }
                        }

                        // The straight preview line was only for feedback while dragging — the
                        // real connector is a kinked (Acrobat-style) two-segment leader, built
                        // below by updateCalloutGeometry once the box exists.
                        canvas.remove(calloutLine);

                        const id = 'callout_' + (calloutCounter++);
                        const tip = { x: calloutLine.tipX, y: calloutLine.tipY };

                        // perPixelTargetFind so a click has to actually land on the thin leader
                        // line itself — otherwise its diagonal bounding box (much bigger than the
                        // visible stroke) swallows clicks meant for the arrowhead at the tip.
                        const leg1 = new fabric.Line([tip.x, tip.y, tip.x, tip.y], {
                            stroke: CALLOUT_DEFAULT_COLOR, strokeWidth: currentWidth, fill: CALLOUT_DEFAULT_COLOR,
                            strokeUniform: true, // see Rect above — keeps stroke weight scale-independent
                            selectable: false, evented: false, strokeLineCap: 'round',
                            perPixelTargetFind: true,
                            calloutId: id, calloutRole: 'leg1', tipX: tip.x, tipY: tip.y
                        });
                        const leg2 = new fabric.Line([tip.x, tip.y, tip.x, tip.y], {
                            stroke: CALLOUT_DEFAULT_COLOR, strokeWidth: currentWidth, fill: CALLOUT_DEFAULT_COLOR,
                            strokeUniform: true,
                            selectable: false, evented: false, strokeLineCap: 'round',
                            perPixelTargetFind: true,
                            calloutId: id, calloutRole: 'leg2'
                        });
                        calloutHead.set({ calloutId: id, calloutRole: 'head' });

                        // The visible note "card" — background + border live here, never on the
                        // text itself, so the border reads as a clean box outline, not a text stroke.
                        const frame = new fabric.Rect({
                            left: dropX, top: dropY, width: 10, height: 10,
                            fill: `rgba(255, 255, 255, ${currentOpacity})`,
                            stroke: CALLOUT_DEFAULT_COLOR, strokeWidth: currentWidth,
                            strokeUniform: true, // see Rect (shape tool) above
                            rx: 8, ry: 8, selectable: false, evented: false,
                            calloutId: id, calloutRole: 'frame'
                        });

                        calloutBox = new fabric.Textbox('Callout Note', {
                            left: dropX, top: dropY, originX: 'center', originY: 'center',
                            // Text always matches the stroke/leader/arrowhead color (see
                            // syncCalloutColor) — both start at CALLOUT_DEFAULT_COLOR here.
                            width: 190, fontFamily: currentFont, fill: CALLOUT_DEFAULT_COLOR, fontWeight: '600',
                            fontSize: currentFontSize,
                            calloutId: id, calloutRole: 'box',
                            // Selection border/corners draw padded out to CALLOUT_PADDING so they
                            // hug the visible card, not just the tight text — purely cosmetic,
                            // doesn't affect the text layout or the tight click/hit area.
                            padding: CALLOUT_PADDING,
                            // No rotate handle, no vertical stretch — corner handles stay
                            // proportional-only, but the side handles are left on so the box's
                            // wrap width can still be dragged wider/narrower.
                            lockRotation: true,
                            lockUniScaling: true
                        });
                        calloutBox.setControlsVisibility({
                            mtr: false, mt: false, mb: false
                        });

                        canvas.add(leg1, leg2, frame, calloutBox);
                        // Keep the arrowhead on top of the leader lines so a click at the tip
                        // hits the (bigger, easier-to-grab) head first, not the leader.
                        canvas.bringToFront(calloutHead);
                        calloutRegistry[id] = { leg1, leg2, head: calloutHead, frame, box: calloutBox };
                        updateCalloutGeometry(calloutRegistry[id]);
                        if (clickedImage) {
                            // Auto-parked against an edge of an image — re-stack every callout on
                            // this same edge in tip order so leader lines fan out without
                            // crossing, rather than just nudging this one clear of whatever it
                            // happens to overlap.
                            relayoutCalloutsForImageEdge(clickedImage, creationSide);
                        } else {
                            resolveCalloutOverlap(calloutRegistry[id]);
                        }
                        // Keep the frame glued to the box's full padded area even while typing
                        // reflows/resizes it (Textbox's own backgroundColor only hugs the text
                        // lines, not the padding — that mismatch is why the old box never looked
                        // "bled" into its background).
                        calloutBox.on('changed', () => updateCalloutGeometry(calloutRegistry[id]));
                        calloutBox.on('editing:exited', () => updateCalloutGeometry(calloutRegistry[id]));

                        canvas.setActiveObject(calloutBox);
                        // Capture locally — the shared calloutBox variable gets nulled out
                        // below before this timeout fires
                        const newBox = calloutBox;
                        setTimeout(() => {
                            newBox.enterEditing();
                            newBox.selectAll();
                        }, 50);

                        saveHistory();
                    }

                    calloutLine = null; calloutHead = null; calloutBox = null;
                    setMode('select', 'btn-select');
                }

                if (currentMode === 'arrow' && isDrawingArrow) {
                    isDrawingArrow = false;

                    // Only create group if a line was actually drawn (prevents tiny dots on accidental click)
                    if (arrowLine && (arrowLine.x1 !== arrowLine.x2 || arrowLine.y1 !== arrowLine.y2)) {
                        arrowLine.set({ selectable: true, evented: true });
                        arrowHead.set({ selectable: true, evented: true });
                        
                        // Group line and head together
                        const arrowGroup = new fabric.Group([arrowLine, arrowHead], {
                            selectable: true,
                            cornerColor: '#3b82f6', 
                            borderColor: '#3b82f6', 
                            transparentCorners: false
                        });
                        
                        canvas.remove(arrowLine, arrowHead);
                        canvas.add(arrowGroup);
                        canvas.setActiveObject(arrowGroup);
                        saveHistory();
                    } else if (arrowLine) {
                        canvas.remove(arrowLine, arrowHead); // Remove accidental clicks
                    }
                    
                    // Switch back to select mode automatically after drawing an arrow
                    setMode('select', 'btn-select');
                }
            });

            canvas.on('mouse:dblclick', function(o) {
                if (currentMode === 'polygon') {
                    finishPolygon();
                    return;
                }
                // Double-clicking anywhere on the visible card (not just the tight text) should
                // drop straight into editing, same as double-clicking the text itself.
                if (currentMode === 'select' && o.target && o.target.calloutRole === 'frame') {
                    const entry = calloutRegistry[o.target.calloutId];
                    if (entry && entry.box) {
                        canvas.setActiveObject(entry.box);
                        entry.box.enterEditing();
                        entry.box.selectAll();
                        canvas.requestRenderAll();
                    }
                }
            });

            // Undo Function
            function undo() {
                if (history.length > 0) {
                    isUndoing = true;
                    const state = history.pop();
                    canvas.loadFromJSON(state, function() {
                        canvas.renderAll();
                        isUndoing = false;
                        currentState = state; // Keep track of the newly loaded state
                        rebuildCalloutRegistry(); // loadFromJSON creates fresh objects, relink them
                        updateActionButtons();
                    });
                }
            }

            document.getElementById('btn-undo').addEventListener('click', undo);

            document.getElementById('imageUpload').addEventListener('change', function(e) {
                const files = e.target.files;
                if (!files || files.length === 0) return;

                processFiles(files);

                // Reset input so same files can be selected again if needed
                e.target.value = '';
            });

            // In-board copy/paste (Ctrl/Cmd+C then Ctrl/Cmd+V) for the current selection —
            // this is a separate, internal clipboard from the OS one. Without it, Ctrl+V falls
            // through to the OS-image paste handler below, which silently pastes whatever
            // image happened to be on the system clipboard instead of duplicating the
            // selected object, which is what users actually expect from Ctrl+C/Ctrl+V.
            let internalClipboard = null; // array of { kind: 'object', obj } | { kind: 'callout', calloutId }
            let suppressNextOsPaste = false;
            const INTERNAL_PASTE_OFFSET = 24;

            function cloneFabricObject(obj) {
                return new Promise(resolve => obj.clone(resolve));
            }

            function copySelectionToInternalClipboard() {
                const active = canvas.getActiveObject();
                if (!active || active.isEditing) return false;

                const objects = active.type === 'activeSelection' ? active.getObjects() : [active];
                const seenCallouts = new Set();
                const items = [];
                objects.forEach(obj => {
                    if (obj.calloutId) {
                        if (seenCallouts.has(obj.calloutId)) return;
                        seenCallouts.add(obj.calloutId);
                        items.push({ kind: 'callout', calloutId: obj.calloutId });
                    } else {
                        items.push({ kind: 'object', obj });
                    }
                });

                if (items.length === 0) return false;
                internalClipboard = items;
                return true;
            }

            async function pasteInternalClipboard() {
                if (!internalClipboard || internalClipboard.length === 0) return;
                const dx = INTERNAL_PASTE_OFFSET, dy = INTERNAL_PASTE_OFFSET;
                const pasted = [];

                for (const item of internalClipboard) {
                    if (item.kind === 'object') {
                        const cloned = await cloneFabricObject(item.obj);
                        cloned.set({ left: item.obj.left + dx, top: item.obj.top + dy, evented: true });
                        canvas.add(cloned);

                        // Keep a pasted image below annotations, same rule addImageToCanvas uses
                        if (cloned.type === 'image') {
                            const canvasObjects = canvas.getObjects();
                            let lowestAnnotationIndex = -1;
                            for (let i = 0; i < canvasObjects.length - 1; i++) {
                                if (canvasObjects[i].type !== 'image') { lowestAnnotationIndex = i; break; }
                            }
                            if (lowestAnnotationIndex !== -1) cloned.moveTo(lowestAnnotationIndex);
                        }

                        pasted.push(cloned);
                    } else if (item.kind === 'callout') {
                        const entry = calloutRegistry[item.calloutId];
                        if (!entry) continue;

                        const newId = 'callout_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);

                        const newLeg1 = new fabric.Line(
                            [entry.leg1.x1 + dx, entry.leg1.y1 + dy, entry.leg1.x2 + dx, entry.leg1.y2 + dy],
                            {
                                stroke: entry.leg1.stroke, strokeWidth: entry.leg1.strokeWidth, fill: entry.leg1.fill,
                                strokeUniform: true, selectable: false, evented: false, strokeLineCap: 'round',
                                perPixelTargetFind: true, calloutId: newId, calloutRole: 'leg1',
                                tipX: entry.leg1.tipX + dx, tipY: entry.leg1.tipY + dy
                            }
                        );
                        const newLeg2 = new fabric.Line(
                            [entry.leg2.x1 + dx, entry.leg2.y1 + dy, entry.leg2.x2 + dx, entry.leg2.y2 + dy],
                            {
                                stroke: entry.leg2.stroke, strokeWidth: entry.leg2.strokeWidth, fill: entry.leg2.fill,
                                strokeUniform: true, selectable: false, evented: false, strokeLineCap: 'round',
                                perPixelTargetFind: true, calloutId: newId, calloutRole: 'leg2'
                            }
                        );

                        const newHead = await cloneFabricObject(entry.head);
                        newHead.set({ left: entry.head.left + dx, top: entry.head.top + dy, calloutId: newId, calloutRole: 'head', selectable: false, evented: false });

                        const newFrame = await cloneFabricObject(entry.frame);
                        newFrame.set({ left: entry.frame.left + dx, top: entry.frame.top + dy, calloutId: newId, calloutRole: 'frame', selectable: false, evented: false });

                        const newBox = await cloneFabricObject(entry.box);
                        newBox.set({ left: entry.box.left + dx, top: entry.box.top + dy, calloutId: newId, calloutRole: 'box' });

                        canvas.add(newLeg1, newLeg2, newFrame, newBox, newHead);
                        canvas.bringToFront(newHead);

                        calloutRegistry[newId] = { leg1: newLeg1, leg2: newLeg2, head: newHead, frame: newFrame, box: newBox };
                        updateCalloutGeometry(calloutRegistry[newId]);
                        newBox.on('changed', () => updateCalloutGeometry(calloutRegistry[newId]));
                        newBox.on('editing:exited', () => updateCalloutGeometry(calloutRegistry[newId]));

                        pasted.push(newBox);
                    }
                }

                if (pasted.length === 0) return;
                canvas.discardActiveObject();
                if (pasted.length === 1) {
                    canvas.setActiveObject(pasted[0]);
                } else {
                    canvas.setActiveObject(new fabric.ActiveSelection(pasted, { canvas }));
                }
                canvas.requestRenderAll();
                saveHistory();
            }

            // Paste images straight from the clipboard (Ctrl/Cmd+V) onto the canvas
            document.addEventListener('paste', (e) => {
                // An internal Ctrl+C/Ctrl+V duplication just handled this same keystroke —
                // don't also paste whatever image happens to be sitting on the OS clipboard.
                if (suppressNextOsPaste) {
                    suppressNextOsPaste = false;
                    return;
                }

                // Don't steal a paste meant for an in-progress text edit (callout/text box)
                const active = canvas.getActiveObject();
                if (active && active.isEditing) return;

                const items = (e.clipboardData || window.clipboardData || {}).items;
                if (!items) return;

                const files = [];
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type && items[i].type.indexOf('image') !== -1) {
                        const file = items[i].getAsFile();
                        if (file) files.push(file);
                    }
                }

                if (files.length > 0) {
                    e.preventDefault();

                    // Paste under the mouse's last known position (same conversion the drop
                    // handler uses), falling back to canvas center if it's off-canvas or the
                    // cursor position was never tracked (e.g. paste via a menu action).
                    let pastePoint = null;
                    if (lastMouseClientX !== null) {
                        const rect = document.getElementById('canvas-container').getBoundingClientRect();
                        const vpt = canvas.viewportTransform;
                        if (lastMouseClientX >= rect.left && lastMouseClientX <= rect.right &&
                            lastMouseClientY >= rect.top && lastMouseClientY <= rect.bottom) {
                            pastePoint = {
                                x: (lastMouseClientX - rect.left - vpt[4]) / vpt[0],
                                y: (lastMouseClientY - rect.top - vpt[5]) / vpt[3]
                            };
                        }
                    }
                    processFiles(files, pastePoint);
                }
            });

            function deleteSelected() {
                const activeObjects = canvas.getActiveObjects();
                if (activeObjects.length) {
                    // Deselect before removing to prevent errors
                    canvas.discardActiveObject();
                    activeObjects.forEach(function(object) {
                        // Deleting a callout's box also removes its (non-selectable) leader/frame parts
                        if (object.calloutId) {
                            const entry = calloutRegistry[object.calloutId];
                            if (entry) {
                                if (entry.leg1) canvas.remove(entry.leg1);
                                if (entry.leg2) canvas.remove(entry.leg2);
                                if (entry.head) canvas.remove(entry.head);
                                if (entry.frame) canvas.remove(entry.frame);
                                delete calloutRegistry[object.calloutId];
                            }
                        }
                        canvas.remove(object);
                    });
                    saveHistory();
                }
            }

            document.getElementById('btn-delete').addEventListener('click', deleteSelected);

            // Bind Delete/Backspace, Escape and Undo (Ctrl+Z) keys
            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                    e.preventDefault();
                    undo();
                    return;
                }

                // Don't hijack Ctrl+C/Ctrl+V typed into a toolbar field (color hex, weight, font)
                const activeTag = document.activeElement && document.activeElement.tagName;
                const inFormField = activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT';

                if (!inFormField && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
                    if (copySelectionToInternalClipboard()) {
                        // Native copy is left to run too (harmless no-op on a canvas selection)
                        // so this doesn't block genuine text copying elsewhere on the page.
                    }
                    return;
                }

                if (!inFormField && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
                    const activeObj = canvas.getActiveObject();
                    if (activeObj && activeObj.isEditing) return; // typing inside a text box — leave alone
                    if (internalClipboard) {
                        e.preventDefault();
                        suppressNextOsPaste = true;
                        pasteInternalClipboard();
                        return;
                    }
                }

                if (e.key === 'Escape') {
                    if (!reorderPopup.classList.contains('hidden')) {
                        closeReorderPopup();
                    } else if (isPickingCompareTarget) {
                        cancelComparePicking();
                    } else if (currentMode === 'polygon') {
                        finishPolygonOpen();
                    } else if (currentMode !== 'select') {
                        setMode('select', 'btn-select');
                    }
                }

                // Ensure we aren't typing inside a text box
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    if (canvas.getActiveObject() && !canvas.getActiveObject().isEditing) {
                        e.preventDefault();
                        deleteSelected();
                    }
                }
            });

            const multiSelectToolbar = document.getElementById('multi-select-toolbar');
            
            function updateMultiSelectToolbar() {
                const activeObj = canvas.getActiveObject();
                const isMultiSelect = !!activeObj && activeObj.type === 'activeSelection';
                // Any single selected object also gets this floating toolbar — for Reorder
                // (and, for images specifically, Compare). The align/layout/scale buttons stay
                // hidden since they need 2+ objects.
                const isSingleObject = !!activeObj && activeObj.type !== 'activeSelection';
                const isSingleImage = !!activeObj && activeObj.type === 'image';

                if (isMultiSelect || isSingleObject) {
                    const boundingRect = activeObj.getBoundingRect(true);

                    // Convert internal canvas coordinates to DOM coordinates considering zoom and pan
                    const zoom = canvas.getZoom();
                    const vpt = canvas.viewportTransform;

                    // Always locked to the top of the combined selection bounding box
                    const domLeft = (boundingRect.left * zoom) + vpt[4] + ((boundingRect.width * zoom) / 2);
                    const domTop = (boundingRect.top * zoom) + vpt[5] - 50;

                    multiSelectToolbar.style.top = `${domTop}px`;
                    multiSelectToolbar.style.left = `${domLeft}px`;
                    multiSelectToolbar.classList.add('toolbar-visible');

                    document.getElementById('multi-only-controls').classList.toggle('hidden', !isMultiSelect);

                    // Compare shows for exactly two images selected together, OR a single
                    // selected image (clicking it then starts the "pick a partner" flow).
                    let showCompare = false;
                    if (isMultiSelect) {
                        const members = activeObj.getObjects();
                        showCompare = members.length === 2 && members.every(o => o.type === 'image');
                    } else if (isSingleImage) {
                        showCompare = true;
                    }
                    document.getElementById('btn-compare').classList.toggle('hidden', !showCompare);
                } else {
                    multiSelectToolbar.classList.remove('toolbar-visible');
                    closeReorderPopup();
                }
                updateActionButtons();
            }

            canvas.on('selection:created', updateMultiSelectToolbar);
            canvas.on('selection:updated', updateMultiSelectToolbar);
            canvas.on('selection:cleared', updateMultiSelectToolbar);

            // Reorder popup: bring-to-front / forward / backward / send-to-back for whatever
            // is currently selected (a single object, or every object in a multi-selection).
            const reorderPopup = document.getElementById('reorder-popup');

            function closeReorderPopup() {
                reorderPopup.classList.add('hidden');
            }

            document.getElementById('btn-reorder').addEventListener('click', (e) => {
                e.stopPropagation();
                reorderPopup.classList.toggle('hidden');
            });

            document.addEventListener('mousedown', (e) => {
                if (!reorderPopup.classList.contains('hidden') && !reorderPopup.contains(e.target) && e.target.id !== 'btn-reorder' && !document.getElementById('btn-reorder').contains(e.target)) {
                    closeReorderPopup();
                }
            });

            function reorderSelection(action) {
                const objects = canvas.getActiveObjects();
                if (!objects.length) return;
                const byIndex = (o) => canvas._objects.indexOf(o);
                if (action === 'front') {
                    [...objects].sort((a, b) => byIndex(a) - byIndex(b)).forEach(o => canvas.bringToFront(o));
                } else if (action === 'back') {
                    [...objects].sort((a, b) => byIndex(b) - byIndex(a)).forEach(o => canvas.sendToBack(o));
                } else if (action === 'forward') {
                    [...objects].sort((a, b) => byIndex(b) - byIndex(a)).forEach(o => canvas.bringForward(o));
                } else if (action === 'backward') {
                    [...objects].sort((a, b) => byIndex(a) - byIndex(b)).forEach(o => canvas.sendBackwards(o));
                }
                canvas.requestRenderAll();
                saveHistory();
            }

            document.getElementById('btn-reorder-front').addEventListener('click', () => reorderSelection('front'));
            document.getElementById('btn-reorder-forward').addEventListener('click', () => reorderSelection('forward'));
            document.getElementById('btn-reorder-backward').addEventListener('click', () => reorderSelection('backward'));
            document.getElementById('btn-reorder-back').addEventListener('click', () => reorderSelection('back'));

            // A single fixed label element handles the common single-image-selection case; a
            // multi-selection needs one label per selected image, so extra labels are cloned
            // from it on demand into this pool instead of hardcoding a fixed number up front.
            const imageNameLabelPool = [document.getElementById('image-name-label')];

            function getPooledImageLabel(i) {
                if (!imageNameLabelPool[i]) {
                    const el = imageNameLabelPool[0].cloneNode(false);
                    el.removeAttribute('id');
                    imageNameLabelPool[0].parentNode.appendChild(el);
                    imageNameLabelPool[i] = el;
                }
                return imageNameLabelPool[i];
            }

            // A label shows the filename, then its pixel resolution underneath in smaller
            // text — built once per pooled element (as two child divs) and reused/updated in
            // place on every call instead of rebuilding the DOM on each selection/drag tick.
            function setImageLabelContent(el, name, width, height) {
                if (!el._nameEl) {
                    el.textContent = '';
                    el._nameEl = document.createElement('div');
                    el._resEl = document.createElement('div');
                    el._resEl.style.cssText = 'font-size:0.78em;opacity:0.7;margin-top:2px;font-weight:400;';
                    el.appendChild(el._nameEl);
                    el.appendChild(el._resEl);
                }
                el._nameEl.textContent = name;
                const aspect = height ? (width / height).toFixed(2) : '?';
                el._resEl.textContent = `${width} × ${height} · ${aspect}`;
            }

            function updateImageNameLabel() {
                const activeObj = canvas.getActiveObject();

                // Every currently selected image that came from a real upload (has a recorded
                // source filename) — either the one selected image, or every image swept into
                // a multi-selection.
                let images = [];
                if (activeObj && activeObj.type === 'image' && activeObj.sourceFileName) {
                    images = [activeObj];
                } else if (activeObj && activeObj.type === 'activeSelection') {
                    images = activeObj.getObjects().filter(o => o.type === 'image' && o.sourceFileName);
                }

                const zoom = canvas.getZoom();
                const vpt = canvas.viewportTransform;
                // Scale the label itself with canvas zoom so it stays proportional to the
                // image's own on-screen size instead of a fixed DOM font-size — at low zoom a
                // constant-size label reads huge next to a shrunk image and multiple labels
                // overlap; clamped so it never becomes illegible (too small) or oversized.
                const labelScale = Math.max(0.35, Math.min(zoom, 1.75));
                const inset = 8 * labelScale;

                images.forEach((img, i) => {
                    // getBoundingRect() is group-relative while part of an activeSelection —
                    // getAbsoluteBoundingRect() resolves it back to true canvas coordinates.
                    const boundingRect = getAbsoluteBoundingRect(img);
                    const domLeft = (boundingRect.left * zoom) + vpt[4] + (boundingRect.width * zoom) - inset;
                    const domTop = (boundingRect.top * zoom) + vpt[5] + (boundingRect.height * zoom) - inset;

                    const label = getPooledImageLabel(i);
                    setImageLabelContent(label, img.sourceFileName, Math.round(img.width), Math.round(img.height));
                    label.style.top = `${domTop}px`;
                    label.style.left = `${domLeft}px`;
                    label.style.transformOrigin = 'bottom right';
                    label.style.transform = `translate(-100%, -100%) scale(${labelScale})`;
                    label.classList.add('label-visible');
                });

                // Park any pooled labels not needed this time (e.g. selection shrank from 3
                // images to 1) so they don't linger showing stale names/positions.
                for (let i = images.length; i < imageNameLabelPool.length; i++) {
                    imageNameLabelPool[i].classList.remove('label-visible');
                }
            }

            canvas.on('selection:created', updateImageNameLabel);
            canvas.on('selection:updated', updateImageNameLabel);
            canvas.on('selection:cleared', updateImageNameLabel);
            
            // Snapshot which shapes/callouts should ride along with an image BEFORE it starts
            // moving. Doing this lazily on the first 'object:moving' tick instead would read the
            // image's bounds AFTER Fabric already nudged it for that frame, which is close enough
            // for area-overlap checks but not for the tip's exact point-in-image test below — a
            // tip sitting right at the image's edge could fall outside on that very first tick.
            function computeStickyData(obj) {
                isDraggingSticky = true;
                stickyOffsets = [];
                calloutStickies = [];

                const allObjects = canvas.getObjects();
                const objBounds = obj.getBoundingRect(true);

                allObjects.forEach(otherObj => {
                    // Callouts are handled separately below, keyed off their combined bounds
                    if (otherObj !== obj && otherObj.type !== 'image' && !guideLines.includes(otherObj) && !otherObj.calloutId) {
                        const otherBounds = otherObj.getBoundingRect(true);
                        // Any overlap at all with the image counts — not just full containment
                        if (rectsOverlap(objBounds, otherBounds)) {
                            stickyOffsets.push({
                                obj: otherObj,
                                offsetX: otherObj.left - obj.left,
                                offsetY: otherObj.top - obj.top
                            });
                        }
                    }
                });

                // A callout can visually overlap more than one image at once (its card
                // parked beside a second photo, say) — anchor it to whichever image the
                // arrow actually POINTS TO first; only fall back to "just overlapping"
                // when the tip isn't sitting over any image at all. That way dragging a
                // photo the callout merely overlaps, but isn't pointing at, leaves it put.
                const allImages = allObjects.filter(o => o.type === 'image');
                Object.values(calloutRegistry).forEach(entry => {
                    if (!entry.leg1 || !entry.leg2 || !entry.head || !entry.box || !entry.frame) return;
                    const tipX = entry.leg1.tipX, tipY = entry.leg1.tipY;
                    const frameRect = getCalloutFrameRect(entry.box);
                    const calloutBounds = {
                        left: Math.min(tipX, frameRect.left),
                        top: Math.min(tipY, frameRect.top),
                        width: Math.max(tipX, frameRect.left + frameRect.width) - Math.min(tipX, frameRect.left),
                        height: Math.max(tipY, frameRect.top + frameRect.height) - Math.min(tipY, frameRect.top)
                    };
                    let anchorImage = allImages.find(img => pointInRect(tipX, tipY, img.getBoundingRect(true)));
                    if (!anchorImage) {
                        anchorImage = allImages.find(img => rectsOverlap(img.getBoundingRect(true), calloutBounds));
                    }
                    if (anchorImage === obj) {
                        calloutStickies.push({
                            entry,
                            tipX: tipX - obj.left, tipY: tipY - obj.top,
                            leg1X2: entry.leg1.x2 - obj.left, leg1Y2: entry.leg1.y2 - obj.top,
                            leg2X1: entry.leg2.x1 - obj.left, leg2Y1: entry.leg2.y1 - obj.top,
                            leg2X2: entry.leg2.x2 - obj.left, leg2Y2: entry.leg2.y2 - obj.top,
                            headX: entry.head.left - obj.left, headY: entry.head.top - obj.top,
                            frameX: entry.frame.left - obj.left, frameY: entry.frame.top - obj.top,
                            boxX: entry.box.left - obj.left, boxY: entry.box.top - obj.top
                        });
                    }
                });
            }

            canvas.on('object:moving', function(options) {
                updateMultiSelectToolbar();
                updateImageNameLabel();

                const obj = options.target;

                // Sticky annotations logic (move overlying text/shapes when image moves)
                if (obj.type === 'image') {
                    // Normally already computed from mouse:down (see below) — this is only a
                    // fallback for a move triggered some other way (e.g. arrow keys).
                    if (!isDraggingSticky) {
                        computeStickyData(obj);
                    }

                    // Apply sticky offsets during movement
                    stickyOffsets.forEach(sticky => {
                        sticky.obj.set({
                            left: obj.left + sticky.offsetX,
                            top: obj.top + sticky.offsetY
                        });
                        sticky.obj.setCoords();
                    });

                    // Rigidly translate the whole callout (tip + leader + frame + box) with the image
                    calloutStickies.forEach(sticky => {
                        const e = sticky.entry;
                        const newTipX = obj.left + sticky.tipX;
                        const newTipY = obj.top + sticky.tipY;
                        e.leg1.set({
                            x1: newTipX, y1: newTipY,
                            x2: obj.left + sticky.leg1X2, y2: obj.top + sticky.leg1Y2,
                            tipX: newTipX, tipY: newTipY
                        });
                        e.leg1.setCoords();
                        e.leg2.set({
                            x1: obj.left + sticky.leg2X1, y1: obj.top + sticky.leg2Y1,
                            x2: obj.left + sticky.leg2X2, y2: obj.top + sticky.leg2Y2
                        });
                        e.leg2.setCoords();
                        e.head.set({ left: obj.left + sticky.headX, top: obj.top + sticky.headY });
                        e.head.setCoords();
                        e.frame.set({ left: obj.left + sticky.frameX, top: obj.top + sticky.frameY });
                        e.frame.setCoords();
                        e.box.set({ left: obj.left + sticky.boxX, top: obj.top + sticky.boxY });
                        e.box.setCoords();
                    });
                } else if (obj.calloutRole === 'box') {
                    // User is dragging just the note itself — the tip stays anchored in
                    // place and the arrow re-angles live to follow the box.
                    const entry = calloutRegistry[obj.calloutId];
                    if (entry) updateCalloutGeometry(entry);
                } else if (obj.type === 'activeSelection') {
                    // Dragging a multi-selection fires exactly one 'object:moving' for the
                    // whole group — neither branch above ever matches, since `obj` here is the
                    // selection container, not an individual box. Without this, any callout
                    // box swept into the selection gets moved by Fabric's own group-transform
                    // math, but its leader/frame (which aren't part of the selection at all)
                    // never hear about it and are left pointing at a stale position — producing
                    // exactly the "everything looks messed up" leader-line corruption. Update
                    // each callout box member directly; getCalloutFrameRect() already resolves
                    // a grouped object's true canvas position correctly.
                    obj.getObjects().forEach(member => {
                        if (member.calloutRole === 'box') {
                            const entry = calloutRegistry[member.calloutId];
                            if (entry) updateCalloutGeometry(entry);
                        }
                    });
                }


                // Smart-guide alignment snap — always on, only while dragging an image
                if (obj.type !== 'image') {
                    clearGuidelines();
                    return;
                }

                clearGuidelines();
                snapToObjects(obj);
            });

            canvas.on('object:scaling', function(options) {
                updateMultiSelectToolbar();
                updateImageNameLabel();
                const obj = options.target;
                if (obj && obj.calloutRole === 'box') {
                    // Fabric's `padding` (used to draw the selection border out to the padded
                    // card, not just the tight text) is a fixed screen-pixel value — it does NOT
                    // grow with the object's own scale. Left alone, the blue selection outline
                    // drifts inward from the actual (now-bigger) card the more you scale it up.
                    // Keep it proportional to scale so the two stay in sync.
                    obj.padding = CALLOUT_PADDING * obj.scaleX;
                    const entry = calloutRegistry[obj.calloutId];
                    if (entry) updateCalloutGeometry(entry);
                }
            });

            // Dragging a Textbox's side handles (ml/mr) fires 'object:resizing', not
            // 'object:scaling' — keep the callout's frame/leader glued to the box as its
            // wrap width changes.
            canvas.on('object:resizing', function(options) {
                updateMultiSelectToolbar();
                const obj = options.target;
                if (obj && obj.calloutRole === 'box') {
                    const entry = calloutRegistry[obj.calloutId];
                    if (entry) updateCalloutGeometry(entry);
                }
            });

            function modifySelection(callback) {
                const activeSelection = canvas.getActiveObject();
                if (!activeSelection || activeSelection.type !== 'activeSelection') return;
                
                const objs = activeSelection.getObjects();

                // Discard selection so we can modify objects in absolute coordinate space
                canvas.discardActiveObject();

                callback(objs);

                // These align/distribute/scale operations reposition or rescale each object
                // directly (not via a fabric drag), so 'object:moving' never fires — any
                // callout box swept up here needs its frame/leader/arrowhead (separate objects,
                // not part of the selection) re-synced to its new spot by hand.
                objs.forEach(obj => {
                    if (obj.calloutRole === 'box') {
                        const entry = calloutRegistry[obj.calloutId];
                        if (entry) updateCalloutGeometry(entry);
                    }
                });

                // Re-create the selection grouping with the updated objects
                const newSelection = new fabric.ActiveSelection(objs, {
                    canvas: canvas
                });
                canvas.setActiveObject(newSelection);
                canvas.requestRenderAll();
                saveHistory();
            }

            // Even gaps between BOUNDING BOXES, not object.left/top directly — objects can have
            // different origins (images/text are center-origin, shapes are left/top-origin), so
            // placing by raw left/top alone produces uneven-looking spacing between edges.
            const LAYOUT_GAP = 36;

            document.getElementById('btn-layout-row').addEventListener('click', () => {
                modifySelection((objs) => {
                    objs.sort((a, b) => a.getBoundingRect(true).left - b.getBoundingRect(true).left);
                    const topY = Math.min(...objs.map(o => o.getBoundingRect(true).top));
                    let currentLeft = objs[0].getBoundingRect(true).left;

                    objs.forEach(obj => {
                        const bounds = obj.getBoundingRect(true);
                        obj.set({
                            left: currentLeft + (obj.left - bounds.left),
                            top: topY + (obj.top - bounds.top)
                        });
                        obj.setCoords();
                        currentLeft += bounds.width + LAYOUT_GAP;
                    });
                });
            });

            document.getElementById('btn-layout-col').addEventListener('click', () => {
                modifySelection((objs) => {
                    objs.sort((a, b) => a.getBoundingRect(true).top - b.getBoundingRect(true).top);
                    const leftX = Math.min(...objs.map(o => o.getBoundingRect(true).left));
                    let currentTop = objs[0].getBoundingRect(true).top;

                    objs.forEach(obj => {
                        const bounds = obj.getBoundingRect(true);
                        obj.set({
                            left: leftX + (obj.left - bounds.left),
                            top: currentTop + (obj.top - bounds.top)
                        });
                        obj.setCoords();
                        currentTop += bounds.height + LAYOUT_GAP;
                    });
                });
            });

            document.getElementById('btn-align-top').addEventListener('click', () => {
                modifySelection((objs) => {
                    const topY = Math.min(...objs.map(o => o.getBoundingRect(true).top));
                    objs.forEach(obj => {
                        const bounds = obj.getBoundingRect(true);
                        obj.set('top', topY + (obj.top - bounds.top));
                        obj.setCoords();
                    });
                });
            });

            document.getElementById('btn-align-center').addEventListener('click', () => {
                modifySelection((objs) => {
                    const topY = Math.min(...objs.map(o => o.getBoundingRect(true).top));
                    const bottomY = Math.max(...objs.map(o => o.getBoundingRect(true).top + o.getBoundingRect(true).height));
                    const centerY = topY + (bottomY - topY) / 2;
                    objs.forEach(obj => {
                        const bounds = obj.getBoundingRect(true);
                        const objCenter = bounds.top + bounds.height / 2;
                        obj.set('top', obj.top + (centerY - objCenter));
                        obj.setCoords();
                    });
                });
            });

            document.getElementById('btn-align-bottom').addEventListener('click', () => {
                modifySelection((objs) => {
                    const bottomY = Math.max(...objs.map(o => o.getBoundingRect(true).top + o.getBoundingRect(true).height));
                    objs.forEach(obj => {
                        const bounds = obj.getBoundingRect(true);
                        const objBottom = bounds.top + bounds.height;
                        obj.set('top', obj.top + (bottomY - objBottom));
                        obj.setCoords();
                    });
                });
            });

            document.getElementById('btn-layout-grid').addEventListener('click', () => {
                modifySelection((objs) => {
                    // Sort roughly top-to-bottom, left-to-right, by bounding box (origin-safe)
                    objs.sort((a, b) => {
                        const ab = a.getBoundingRect(true), bb = b.getBoundingRect(true);
                        return ab.top - bb.top || ab.left - bb.left;
                    });
                    const startX = Math.min(...objs.map(o => o.getBoundingRect(true).left));
                    const startY = Math.min(...objs.map(o => o.getBoundingRect(true).top));

                    // Create a square-ish grid
                    const cols = Math.ceil(Math.sqrt(objs.length));
                    const gap = LAYOUT_GAP;

                    const maxWidth = Math.max(...objs.map(o => o.getBoundingRect(true).width));
                    const maxHeight = Math.max(...objs.map(o => o.getBoundingRect(true).height));

                    let col = 0, row = 0;

                    objs.forEach(obj => {
                        const bounds = obj.getBoundingRect(true);
                        obj.set({
                            left: startX + col * (maxWidth + gap) + (obj.left - bounds.left),
                            top: startY + row * (maxHeight + gap) + (obj.top - bounds.top)
                        });
                        obj.setCoords();

                        col++;
                        if (col >= cols) {
                            col = 0;
                            row++;
                        }
                    });
                });
            });

            document.getElementById('btn-scale-width').addEventListener('click', () => {
                modifySelection((objs) => {
                    const targetWidth = Math.max(...objs.map(o => o.getScaledWidth()));
                    objs.forEach(obj => {
                        const scale = targetWidth / obj.width;
                        obj.set({ scaleX: scale, scaleY: scale });
                        obj.setCoords();
                    });
                });
            });

            document.getElementById('btn-scale-height').addEventListener('click', () => {
                modifySelection((objs) => {
                    const targetHeight = Math.max(...objs.map(o => o.getScaledHeight()));
                    objs.forEach(obj => {
                        const scale = targetHeight / obj.height;
                        obj.set({ scaleX: scale, scaleY: scale });
                        obj.setCoords();
                    });
                });
            });

            // Creates a new before/after compare widget from two images. The two source images
            // are left completely untouched — this only reads their current positions (via
            // getAbsoluteBoundingRect, since they may be group-relative while part of an
            // activeSelection) to size/place the new widget beneath them.
            function createCompareWidget(imgA, imgB) {
                const rectA = getAbsoluteBoundingRect(imgA);
                const rectB = getAbsoluteBoundingRect(imgB);

                // Shared target aspect ratio for the widget: the average of the two images'
                // own aspect ratios, so neither one's crop dominates when they differ a lot.
                const targetAspect = (rectA.width / rectA.height + rectB.width / rectB.height) / 2;
                const targetWidth = (rectA.width + rectB.width) / 2;
                const targetHeight = targetWidth / targetAspect;

                // Center it directly beneath the union of both images' bounds.
                const unionLeft = Math.min(rectA.left, rectB.left);
                const unionRight = Math.max(rectA.left + rectA.width, rectB.left + rectB.width);
                const unionBottom = Math.max(rectA.top + rectA.height, rectB.top + rectB.height);
                const margin = 40;

                const compare = new fabric.CompareSlider(imgA.getElement(), imgB.getElement(), {
                    left: (unionLeft + unionRight) / 2,
                    top: unionBottom + margin + targetHeight / 2,
                    originX: 'center', originY: 'center',
                    width: targetWidth, height: targetHeight,
                    imgAName: imgA.sourceFileName || 'Image A',
                    imgBName: imgB.sourceFileName || 'Image B',
                    stroke: CALLOUT_DEFAULT_COLOR, strokeWidth: currentWidth,
                    cornerColor: '#3b82f6', borderColor: '#3b82f6', transparentCorners: false
                });

                canvas.discardActiveObject();
                canvas.add(compare);
                canvas.setActiveObject(compare);
                canvas.requestRenderAll();
                saveHistory();
            }

            const comparePickHint = document.getElementById('compare-pick-hint');

            function startComparePicking(image) {
                isPickingCompareTarget = true;
                comparePickSource = image;
                canvas.discardActiveObject();
                canvas.defaultCursor = 'crosshair';
                comparePickHint.classList.remove('hidden');
                canvas.requestRenderAll();
            }

            function cancelComparePicking() {
                isPickingCompareTarget = false;
                comparePickSource = null;
                canvas.defaultCursor = 'default';
                comparePickHint.classList.add('hidden');
                if (comparePickHoverTarget) {
                    comparePickHoverTarget.set('shadow', null);
                    comparePickHoverTarget = null;
                    canvas.requestRenderAll();
                }
            }

            // While picking a compare partner, hovering a valid candidate image glows it so
            // it's clear which image a click will pair with.
            canvas.on('mouse:over', function(o) {
                if (!isPickingCompareTarget || !o.target || o.target.type !== 'image' || o.target === comparePickSource) return;
                comparePickHoverTarget = o.target;
                o.target.set('shadow', new fabric.Shadow({ color: '#3b82f6', blur: 30, offsetX: 0, offsetY: 0 }));
                canvas.requestRenderAll();
            });

            canvas.on('mouse:out', function(o) {
                if (comparePickHoverTarget && o.target === comparePickHoverTarget) {
                    comparePickHoverTarget.set('shadow', null);
                    comparePickHoverTarget = null;
                    canvas.requestRenderAll();
                }
            });

            document.getElementById('btn-compare').addEventListener('click', () => {
                const activeObj = canvas.getActiveObject();
                if (!activeObj) return;

                if (activeObj.type === 'activeSelection') {
                    const members = activeObj.getObjects();
                    if (members.length !== 2 || !members.every(o => o.type === 'image')) return;
                    createCompareWidget(members[0], members[1]);
                    return;
                }

                if (activeObj.type === 'image') {
                    startComparePicking(activeObj);
                }
            });

        });
    </script>
</body>
</html>
